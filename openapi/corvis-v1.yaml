openapi: 3.1.0
info:
  title: Corvis API
  version: 1.0.0
  description: Tenant-scoped customer contract. Internal extraction payloads and physical Snowflake tables are not API contracts.
servers:
  - url: /api/v1
security:
  - enterpriseSession: []
paths:
  /me:
    get:
      operationId: getSession
      responses:
        '200': { description: Authenticated tenant/workspace session }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /capabilities:
    get:
      operationId: getCapabilities
      description: Presentation hints for the signed-in identity. The server re-authorizes every request independently; clients use this only to decide which actions to offer.
      responses:
        '200':
          description: Effective permissions and data rights for the current tenant/workspace session
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data: { $ref: '#/components/schemas/WorkspaceCapabilities' }
                  correlationId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /my-workspaces:
    get:
      operationId: listMyWorkspaces
      description: Chrome-only listing of every workspace the signed-in identity actively belongs to in this tenant (e.g. for an account/workspace switcher). Never used for access decisions; entitlement/authorization stays scoped to the requested session's workspace.
      responses:
        '200':
          description: The caller's active workspace memberships
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMembership' }
                  correlationId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: 'Entitled documents. Omitting both limit and cursor returns the full unpaginated list, for backward compatibility with existing callers; passing either activates cursor pagination.' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /funds:
    get:
      operationId: listFunds
      description: Lists only global fund identities present in the caller's authoritative fund entitlement set. Missing fund entitlements fail closed to an empty result.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated entitled fund identities and governed name/identifier history. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /companies:
    get:
      operationId: listCompanies
      description: Lists companies visible through approved observations for the caller's tenant and entitled funds; global identity alone never creates entitlement.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated tenant-visible company identities and governed name/identifier history. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /holdings:
    get:
      operationId: listHoldings
      description: Lists approved tenant-scoped fund positions. Each holding targets exactly one company or underlying fund; an underlying-fund target is returned only when that target fund is also entitled.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated approved holdings with polymorphic company/fund targets and source lineage. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /instruments:
    get:
      operationId: listInstruments
      description: Lists approved security or contractual exposures beneath approved company-targeted holdings on entitled funds. Instruments cannot exist beneath fund-targeted holdings.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated approved instruments with exact source security descriptions and normalized instrument attributes. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /company-lifecycle-events:
    get:
      operationId: listCompanyLifecycleEvents
      description: Lists lifecycle events only when every fund/company participant is visible through the caller's entitlement graph, preventing hidden relationship disclosure.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated visible company lifecycle events with durable participant identities. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /metric-definitions:
    get:
      operationId: listMetricDefinitions
      description: Lists active governed metric dictionary definitions used by customer-facing observations and consolidated facts.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated active metric definitions. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /observations:
    get:
      operationId: listObservations
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: 'Entitled reviewed observations. Omitting both limit and cursor returns the full unpaginated list, for backward compatibility with existing callers; passing either activates cursor pagination.' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /consolidated-facts:
    get:
      operationId: listConsolidatedFacts
      description: Lists tenant-scoped consolidated facts only for entitled funds and only when the fact is included in a published fund-period snapshot.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Paginated published consolidated facts with contributing observation lineage. }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /reconciliations:
    get:
      operationId: listReconciliations
      description: Lists tenant-scoped reconciliation status for entitled funds without exposing internal canonicalization, document or idempotency identifiers.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: 'Paginated reconciliation runs with snapshot, period, readiness and blocking-exception counts.' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /snapshots:
    get:
      operationId: listSnapshots
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: 'Versioned fund-period snapshots. Omitting both limit and cursor returns the full unpaginated list, for backward compatibility with existing callers; passing either activates cursor pagination.' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /review:
    post:
      operationId: reviewObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '202': { description: Review event accepted }
        '409': { description: 'Version conflict', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /snapshots/publish:
    post:
      operationId: publishSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotPublication'
      responses:
        '202': { description: Publication command accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /research:
    post:
      operationId: research
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200': { description: Semantic and source-grounded answer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /research/stream:
    post:
      operationId: researchStream
      description: Streaming variant of /research. Emits newline-delimited JSON progress/result/error events as the answer is produced, then closes; the client aborting the request cancels the in-flight query. Requires research:query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Newline-delimited JSON stream of progress/result/error events
          content:
            application/x-ndjson: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /research/pins:
    get:
      operationId: listResearchPins
      description: Lists this caller's saved Ask Corvis answers (#182 D7), newest first. Requires research:query.
      responses:
        '200': { description: Saved Ask Corvis answers }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: pinResearchAnswer
      description: Saves the exact Ask Corvis answer already returned by /research or /research/stream for later reference; the server never re-runs the question. Requires research:query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer, askedAt]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                answer: { type: object }
                askedAt: { type: string, format: date-time }
      responses:
        '201': { description: Saved answer created }
        '409': { description: 'Per-subject saved-answer limit reached', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /research/pins/{pinId}:
    delete:
      operationId: unpinResearchAnswer
      description: Removes a previously saved Ask Corvis answer. Requires research:query and ownership of the pin.
      parameters:
        - name: pinId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Saved answer removed }
        '404': { description: 'No matching saved answer for this caller', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /source-references/{sourceReferenceId}:
    get:
      operationId: getSourceReference
      description: Returns the permissioned source-document evidence (page/sheet/cell location and excerpt) backing a citation. Requires sources:read plus entitled access to the underlying document; each read is audited.
      parameters:
        - name: sourceReferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Source evidence for the citation
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data:
                    type: object
                    required: [sourceReferenceId, documentId]
                    properties:
                      sourceReferenceId: { type: string }
                      documentId: { type: string }
                      page: { type: integer }
                      sheetName: { type: string }
                      cellRange: { type: string }
                      excerpt: { type: string }
                  correlationId: { type: string }
        '403': { description: 'Missing sources:read permission or document access', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Source reference not found or not entitled', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports:
    get:
      operationId: listExports
      description: Lists the caller's own most recent exports, newest first. Read-only; never issues download grants. Exports whose artifact the caller's current data rights no longer cover are omitted. Requires exports:create and current redistribution rights.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum exports to return. Values outside 1-50 are clamped into that range rather than rejected; a non-numeric value falls back to the default of 20.
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Export history for the signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExportStatus' }
                  correlationId: { type: string }
        '403': { description: 'Missing exports:create permission or redistribution rights', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createExport
      description: Creates a governed export job. Without `scope`, the export covers every currently entitled published snapshot (as before). With `scope.snapshotId`, the export is restricted to that one already-entitled published snapshot (e.g. "export this view" from Review) — the caller must already be entitled to it. With `scope.positionFinancials`, the export is the exact Position Financials view (fund, holding, company, periodicity and optional client portfolio) and is pinned to the published snapshots behind it. A scope that resolves to nothing the caller is entitled to is refused rather than widened. `source` records which product surface requested the export, for delivery-history display; it defaults to `delivery` when omitted. Requires exports:create and redistribution rights. Retries are made safe with an idempotency key, supplied as the `Idempotency-Key` header or the `idempotencyKey` body field (the body field wins when both are present). Replaying the same key with the same request returns the original 202 response and creates no second job, while reusing a key with a different request is rejected with 422 `idempotency_key_reused`. Keys are at most 255 characters.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
          description: Optional retry-safety key; equivalent to the `idempotencyKey` body field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [parquet, csv, xlsx] }
                scope:
                  oneOf:
                    - type: object
                      required: [snapshotId]
                      properties:
                        snapshotId: { type: string, format: uuid }
                    - type: object
                      required: [positionFinancials]
                      properties:
                        positionFinancials:
                          type: object
                          required: [fundId, holdingId, companyId, periodicity]
                          properties:
                            fundId: { type: string, minLength: 1 }
                            holdingId: { type: string, minLength: 1 }
                            companyId: { type: string, minLength: 1 }
                            periodicity: { type: string, enum: [reported, quarterly, annual] }
                            portfolioId: { type: string, minLength: 1, description: Optional client portfolio the view is attributed to. }
                source: { type: string, enum: [delivery, review], default: delivery }
                idempotencyKey: { type: string, maxLength: 255, description: Optional retry-safety key; equivalent to the Idempotency-Key header. }
      responses:
        '202':
          description: Export job accepted (or, for a replayed idempotency key, the original response)
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data: { $ref: '#/components/schemas/ExportManifest' }
                  correlationId: { type: string }
        '400':
          description: Invalid format (`invalid_export_format`), scope (`invalid_export_scope`), source (`invalid_export_source`), idempotency key (`invalid_idempotency_key`) or a body that is not a JSON object (`invalid_request`, `invalid_json`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Missing exports:create permission or redistribution rights; the requested scope is not one of the caller's currently entitled published data (`forbidden`); or parquet delivery is disabled for this tenant (`feature_disabled`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: The Idempotency-Key was already used for a different request (`idempotency_key_reused`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports/{exportId}:
    get:
      operationId: getExport
      description: Returns the current status of a single export owned by the caller, including a fresh short-lived download grant when complete and unexpired. Requires exports:create and current redistribution rights.
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data: { $ref: '#/components/schemas/ExportStatus' }
                  correlationId: { type: string }
        '400': { description: 'Malformed exportId', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Missing exports:create permission or redistribution rights', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Export not found or not owned by the caller', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports/{exportId}/download:
    get:
      operationId: downloadExport
      description: Redeems a single-use download grant (the `grant` query parameter from an ExportStatus.downloadUrl) and streams the export artifact. Requires exports:create and current redistribution rights; the grant itself is short-lived and tenant/subject-scoped.
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: grant
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Export file bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '400': { description: 'Malformed exportId', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Missing exports:create permission or redistribution rights', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Export not found, grant invalid/expired, or artifact unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /jobs:
    get:
      operationId: listProcessingJobs
      description: Lists the tenant's processing jobs. Omitting both `limit` and `cursor` returns the full unpaginated list with `nextCursor` null, for backward compatibility; passing either activates keyset pagination (default page 50, at most 200). Requires documents:read.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Tenant-scoped processing jobs
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor, correlationId]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProcessingJob' }
                  nextCursor:
                    type: [string, 'null']
                    description: Opaque token for the next page, or null when there are no more pages (always null when pagination was not requested).
                  correlationId: { type: string }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/initiate:
    post:
      operationId: initiateUpload
      description: Authorizes a source upload and creates a short-lived native Google Cloud Storage resumable session. The browser sends source bytes directly to GCS; Corvis does not proxy the file body.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, sizeBytes]
              properties:
                fileName: { type: string }
                contentType: { type: string }
                sizeBytes: { type: integer, minimum: 1 }
                lastModified: { type: integer }
                checksumSha256: { type: string }
                idempotencyKey: { type: string }
      responses:
        '201':
          description: GCS resumable upload session created or resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/{uploadId}:
    parameters:
      - in: path
        name: uploadId
        required: true
        schema: { type: string }
    get:
      operationId: getUpload
      description: Requires documents:write. An upload is visible only to the identity that initiated it (or a workspace admin) within the same tenant.
      responses:
        '200': { description: Authorized upload session state and active resumable session URL when applicable }
        '404': { description: 'Upload not found, belongs to another tenant, or was initiated by a different non-admin identity (`upload_not_found`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: abortUpload
      description: Requires documents:write, with the same visibility rule as GET. A completed upload cannot be aborted.
      responses:
        '204': { description: Upload aborted and incomplete GCS session/object cleaned up where possible }
        '404': { description: 'Upload not found, belongs to another tenant, or was initiated by a different non-admin identity (`upload_not_found`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'The upload has already completed (`upload_not_active`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      description: Verifies the completed GCS object, validates file signature and transitions it into quarantine/scan processing. Multipart ETags are not part of the Corvis contract.
      parameters:
        - in: path
          name: uploadId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: false
        description: Optional. The idempotency key may be supplied here or in the Idempotency-Key header; an empty body is accepted.
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: { type: string, maxLength: 255 }
      responses:
        '200': { description: Artifact verified and registered/quarantined }
        '404': { description: 'Upload not found, belongs to another tenant, or was initiated by a different non-admin identity (`upload_not_found`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'The idempotency key does not match the session (`upload_idempotency_mismatch`), the upload is not active (`upload_not_active`) or the object is incomplete (`upload_incomplete`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: 'The uploaded content failed file-signature validation (`invalid_file_content`) or integrity verification (`upload_integrity_failed`)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/readiness:
    get:
      operationId: getReadiness
      responses:
        '200': { description: Admin-only production binding readiness }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/webhooks/subscriptions:
    get:
      operationId: listWebhookSubscriptions
      responses:
        '200': { description: Tenant-scoped webhook subscriptions (metadata only; never includes a signing secret) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointUrl, eventTypes]
              properties:
                endpointUrl: { type: string, format: uri, description: "Must be https, without credentials, and must not target localhost, *.internal/metadata hosts or a loopback, private, link-local or reserved IP address." }
                eventTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [SnapshotPublicationChanged, DataCorrectionOpened, DataCorrectionResolved, CorrectionReplacementDeliveryRequested, ExportRequested]
      responses:
        '201':
          description: Subscription created with its first signing key. The signing secret is returned exactly once, in this response.
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscriptionCreated'
                  correlationId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/webhooks/subscriptions/{webhookId}:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string }
    patch:
      operationId: updateWebhookSubscriptionStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, revoke] }
      responses:
        '200': { description: 'Subscription transitioned. revoke is terminal; pause/resume are reversible.' }
        '400': { description: 'Invalid or unrecognized action', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: "The requested transition is not valid from the subscription's current status", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/webhooks/subscriptions/{webhookId}/rotate-signing-key:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string }
    post:
      operationId: rotateWebhookSigningKey
      description: Retires the current active signing key and activates a freshly generated one atomically. The new secret is returned exactly once, in this response.
      responses:
        '200':
          description: Signing key rotated
          content:
            application/json:
              schema:
                type: object
                required: [data, correlationId]
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSigningKeyRotated'
                  correlationId: { type: string }
        '404': { description: 'Subscription not found or already revoked', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/webhooks/subscriptions/{webhookId}/deliveries:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    get:
      operationId: listWebhookDeliveries
      description: Customer-visible delivery diagnostics for one subscription. This endpoint has no unpaginated caller, so pagination is its only mode.
      responses:
        '200': { description: 'Paginated delivery attempts (state, attempt, status code, last error)' }
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    enterpriseSession:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.com/.well-known/openid-configuration
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Maximum items per page. Presence of this parameter (or `cursor`) activates pagination.
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque continuation token from a previous page's `nextCursor`. Presence of this parameter (or `limit`) activates pagination.
  responses:
    Unauthorized:
      description: The request has no valid authenticated identity, or its tenant/workspace membership is no longer active.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error: { enum: [authentication_required] }
    Forbidden:
      description: The caller's role lacks the required permission, the resource is outside its entitlements, or a tenant-administrator-only action was attempted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error: { type: string, description: 'Usually `forbidden`; `feature_disabled` when a governed feature is off and `tenant_admin_required` for tenant-administrator-only actions.' }
    RateLimited:
      description: The per-tenant, per-subject request budget is exhausted. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (1-60).
          schema: { type: integer, minimum: 1, maximum: 60 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error: { enum: [rate_limited] }
    InternalError:
      description: Unexpected server failure. The body is deliberately opaque; quote `correlationId` when contacting support.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error: { enum: [internal_error] }
    InvalidCursor:
      description: The `cursor` was malformed, tampered with, or `limit` was not a positive integer.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [invalid_cursor] }
              correlationId: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error, correlationId]
      properties:
        error: { type: string, description: Stable machine-readable error code. }
        correlationId: { type: string, description: "Echoes the caller's `x-correlation-id` when it is a bounded log-safe token, otherwise a server-generated id." }
    ProcessingJob:
      type: object
      required: [id, documentId, tenantId, stage, state, attempt, maxAttempts, correlationId, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        tenantId: { type: string }
        stage: { type: string }
        state: { type: string, enum: [queued, running, blocked, retryable, failed, dead_letter, succeeded] }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        correlationId: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        blockedReason: { type: string }
        nextAttemptAt: { type: string, format: date-time }
        recoveryCount: { type: integer }
        lastRecoveryAt: { type: string, format: date-time }
        lastRecoveryReasonCode: { type: string }
        lastError: { type: string }
    WorkspaceCapabilities:
      type: object
      required: [permissions, sourceDocumentAccessAllowed, redistributionAllowed]
      properties:
        permissions:
          type: array
          items:
            type: string
            enum: ['documents:read', 'documents:write', 'sources:read', 'observations:read', 'observations:review', 'snapshots:publish', 'research:query', 'exports:create', 'admin:manage']
        sourceDocumentAccessAllowed: { type: boolean }
        redistributionAllowed: { type: boolean }
    WorkspaceMembership:
      type: object
      required: [workspaceId, roles]
      properties:
        workspaceId: { type: string }
        workspaceDisplayName: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: ['admin', 'reviewer', 'analyst', 'api_client', 'read_only']
    ExportManifest:
      type: object
      required: [exportId, tenantId, generatedAt, schemaVersion, taxonomyVersion, snapshotIds, format, rowCounts, checksumSha256]
      properties:
        exportId: { type: string }
        tenantId: { type: string }
        generatedAt: { type: string, format: date-time }
        schemaVersion: { type: string }
        taxonomyVersion: { type: string }
        snapshotIds: { type: array, items: { type: string } }
        format: { type: string, enum: [parquet, csv, xlsx] }
        rowCounts: { type: object, additionalProperties: { type: integer } }
        checksumSha256: { type: string }
        source: { type: string, enum: [delivery, review], description: 'Which product surface requested this export. Absent on exports created before this field existed.' }
    ExportStatus:
      type: object
      required: [exportId, format, state, createdAt, manifest, downloadAvailable]
      properties:
        exportId: { type: string }
        format: { type: string, enum: [parquet, csv, xlsx] }
        state: { type: string, description: 'Delivery state, e.g. queued, delivering, retryable, complete, failed.' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        checksumSha256: { type: string }
        manifest: { $ref: '#/components/schemas/ExportManifest' }
        downloadAvailable:
          type: boolean
          description: True when the export is complete and unexpired. Listings never include a download link; the single-export read issues a fresh short-lived grant.
        downloadUrl:
          type: string
          description: Short-lived single-subject download grant. Present only on the single-export read, never on the listing.
        downloadExpiresAt: { type: string, format: date-time }
    UploadSession:
      type: object
      required: [uploadId, documentId, artifactVersionId, ingestionId, chunkSize, state]
      properties:
        uploadId: { type: string }
        documentId: { type: string }
        artifactVersionId: { type: string }
        ingestionId: { type: string }
        chunkSize: { type: integer, minimum: 262144 }
        uploadUrl:
          type: string
          description: Sensitive short-lived GCS resumable session URI; clients must not log or persist it beyond resumable-upload recovery needs.
        state: { type: string, enum: [initiated, uploading, quarantined, complete, aborted] }
    ReviewDecision:
      type: object
      required: [observationId, decision, reasonCode, expectedVersion]
      properties:
        observationId: { type: string }
        decision: { type: string, enum: [approve, reject, correct] }
        reasonCode: { type: string }
        correctedValue: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    SnapshotPublication:
      type: object
      required: [snapshotId, action, expectedVersion]
      properties:
        snapshotId: { type: string }
        action: { type: string, enum: [publish, withdraw, supersede] }
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string }
    WebhookSubscriptionCreated:
      type: object
      required: [webhookId, endpointUrl, eventTypes, status, signingSecret, signingKeyId]
      properties:
        webhookId: { type: string }
        endpointUrl: { type: string }
        eventTypes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, paused, revoked] }
        signingSecret:
          type: string
          description: Returned exactly once, at creation time. Never re-readable afterward.
        signingKeyId: { type: string }
    WebhookSigningKeyRotated:
      type: object
      required: [webhookId, signingKeyId, signingSecret]
      properties:
        webhookId: { type: string }
        signingKeyId: { type: string }
        signingSecret:
          type: string
          description: Returned exactly once, at rotation time. Never re-readable afterward.
