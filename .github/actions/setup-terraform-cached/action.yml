name: Setup Terraform with provider cache
description: Install Terraform and reuse provider binaries without caching state or working directories.
inputs:
  terraform-version:
    description: Terraform CLI version
    required: true
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
    - name: Configure Terraform provider cache
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "${GITHUB_ENV}"
    - name: Cache Terraform provider binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-${{ inputs.terraform-version }}-
