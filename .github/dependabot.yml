version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is held back: typescript-eslint (8.71.0, peer
      # typescript <6.1.0) throws at load on TS 7, which ships no JS compiler API.
      # @types/node majors beyond 26 stay held until the Node runtime moves.
      # ESLint majors are no longer ignored (on 10 since #216).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Convex CLI is intentionally isolated from Corvis production dependencies.
  # Keep the deterministic CI pin current through normal dependency PRs; the
  # scheduled conformance canary separately exercises the upstream `latest` image.
  - package-ecosystem: npm
    directory: /db/convex-conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      convex-conformance:
        patterns:
          - "convex"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns:
          - "*"
