version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Held back until the toolchain supports them: typescript-eslint rejects
      # TypeScript 7, eslint-config-next's React/import plugins do not support
      # ESLint 10, and @types/node must track the Node 24 runtime.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Convex CLI is intentionally isolated from Corvis production dependencies.
  # Keep the deterministic CI pin current through normal dependency PRs; the
  # scheduled conformance canary separately exercises the upstream `latest` image.
  - package-ecosystem: npm
    directory: /db/convex-conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      convex-conformance:
        patterns:
          - "convex"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns:
          - "*"
