version: 2

# One consolidated version-update PR for all supported ecosystems each week.
# Dependabot security updates remain separate so urgent fixes are not delayed.
# This is a native multi-ecosystem group: no custom PR aggregation workflow.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly

updates:
  # Application (production + development) and Convex CLI updates participate
  # in the same batch, including major upgrades. CI determines compatibility.
  - package-ecosystem: npm
    directories:
      - /
      - /tools/convex-conformance
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 10

  # External actions remain pinned by immutable SHA; Dependabot updates the SHA.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /services/control-loop
      - /services/extractor
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/*
      - /infra/terraform/modules/*
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 5
