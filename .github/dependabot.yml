version: 2

# One weekly version-update PR across all supported ecosystems.
# Security updates are still independently actionable.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"

updates:
  # Explicit directory entries match the documented multi-ecosystem format.
  # No per-ecosystem schedules, PR limits, or subgroups: the group owns cadence.
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "npm"
    directory: "/tools/convex-conformance"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  # Keep full immutable SHA pins for every third-party action.
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "docker"
    directory: "/services/control-loop"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "docker"
    directory: "/services/extractor"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  # Globs are supported by 'directories', unlike 'directory'.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/environments/*"
      - "/infra/terraform/modules/*"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
