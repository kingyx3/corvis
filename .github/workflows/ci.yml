name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build --pull --tag "corvis-ci:${GITHUB_SHA}" .
      - name: Assert non-root standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "corvis"
          docker run --rm --entrypoint node "corvis-ci:${GITHUB_SHA}" --version
