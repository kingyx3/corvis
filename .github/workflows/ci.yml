name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.txt
      - name: Preserve unit-test failure transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-${{ github.run_id }}
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Terraform format and provider validation
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          mapfile -t roots < <(find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" -gt 0
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done
      - run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build --pull --tag "corvis-ci:${GITHUB_SHA}" .
      - name: Assert non-root standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "corvis"
          docker run --rm --entrypoint node "corvis-ci:${GITHUB_SHA}" --version

  rate-limit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply full Postgres migration chain on a clean database
        shell: bash
        run: |
          set -euo pipefail
          createdb corvis_migration_smoke
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/supabase-auth-fixture.sql
          for migration in db/postgres/migrations/*.sql; do
            echo "Applying ${migration}"
            PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Apply isolated rate-limit migration and acceptance checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate-limit-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/020_distributed_api_rate_limit.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate_limit.sql
      - name: Verify concurrent independent database connections
        run: node db/postgres/tests/rate-limit-concurrency.mjs
      - run: npm ci
      - name: Verify native application Postgres adapter
        env:
          CORVIS_POSTGRES_DSN: postgresql://postgres:ci-disposable-only@localhost:5432/postgres?sslmode=disable
        run: node db/postgres/tests/native-adapter.mjs
