name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

# No job writes to the repository, checks, PRs or security events; actions/cache
# and BuildKit type=gha caches use the runner cache token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Lint, typecheck, unit tests and dependency audit (parallel)
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1 &
          lint_pid=$!
          npm run typecheck > typecheck-output.txt 2>&1 &
          typecheck_pid=$!
          npm audit --audit-level=high > audit-output.txt 2>&1 &
          audit_pid=$!
          npm test > unit-test-output.txt 2>&1 &
          test_pid=$!

          wait "$lint_pid"; lint_status=$?
          wait "$typecheck_pid"; typecheck_status=$?
          wait "$audit_pid"; audit_status=$?
          wait "$test_pid"; test_status=$?

          echo "::group::npm run lint"; cat lint-output.txt; echo "::endgroup::"
          echo "::group::npm run typecheck"; cat typecheck-output.txt; echo "::endgroup::"
          echo "::group::npm audit --audit-level=high"; cat audit-output.txt; echo "::endgroup::"
          echo "::group::npm test"; cat unit-test-output.txt; echo "::endgroup::"

          status=0
          for s in "$lint_status" "$typecheck_status" "$audit_status" "$test_status"; do
            [ "$s" -eq 0 ] || status=1
          done
          exit "$status"
      - name: Preserve unit-test failure transcript
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-output-${{ github.run_id }}
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 14

  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hadolint (pinned by digest)
        shell: bash
        run: |
          set -euo pipefail
          image="hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d"
          for dockerfile in Dockerfile Dockerfile.control-loop; do
            echo "Linting ${dockerfile}"
            docker run --rm -i "${image}" hadolint --failure-threshold warning - < "${dockerfile}"
          done

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"
      - name: Terraform format and provider validation
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          mapfile -t roots < <(find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" -gt 0
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done
      # Provider versions and hashes are pinned in committed lockfiles (#236), for
      # every platform a contributor or runner uses. A missing or stale lockfile
      # fails here and the regenerated file is printed so it can be committed.
      - name: Terraform provider lockfiles are committed and current
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <( (find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d; echo infra/terraform/shared/cloudflare) | sort)
          stale=0
          for root in "${roots[@]}"; do
            terraform -chdir="${root}" init -backend=false -input=false >/dev/null
            terraform -chdir="${root}" providers lock -platform=linux_amd64 -platform=darwin_amd64 -platform=darwin_arm64 >/dev/null
            if [[ -n "$(git status --porcelain -- "${root}/.terraform.lock.hcl")" ]]; then
              stale=1
              echo "::error file=${root}/.terraform.lock.hcl::Provider lockfile is missing or stale; commit the file below."
              echo "----- BEGIN ${root}/.terraform.lock.hcl -----"
              cat "${root}/.terraform.lock.hcl"
              echo "----- END ${root}/.terraform.lock.hcl -----"
            fi
          done
          exit "${stale}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Cache Next.js compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Install browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e
      - name: Production CSP nonce regression (customer and admin surfaces)
        run: npm run build && npm run test:e2e:csp

  # Every other e2e spec runs against the in-memory demo port. This job builds the app the way it
  # ships (demo off), proves no demo fixture reaches the client bundle, and smoke-tests the real
  # HTTP adapter and authentication boundary (#237).
  non-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORVIS_DEMO_MODE: "false"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
      - name: Demo fixtures stay out of the production client bundle
        shell: bash
        run: |
          set -euo pipefail
          # Every fixture string from adapters/demo/catalog.ts, plus the demo failure-injection marker.
          node scripts/check-bundle-demo-free.ts .next/static
          if grep -rl "corvis:demo:fail:" .next/static; then
            echo "::error::demo fixtures were bundled into a non-demo build (see files above)"
            exit 1
          fi
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Non-demo smoke
        run: npm run test:e2e:non-demo

  # Keep the historic required-check context stable while the expensive gates run
  # independently. Every prior frontend check remains blocking through this fan-in.
  frontend:
    needs: [quality, dockerfile-lint, terraform, build, e2e, non-demo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all frontend gates passed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCKERFILE_LINT_RESULT: ${{ needs.dockerfile-lint.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          NON_DEMO_RESULT: ${{ needs.non-demo.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$DOCKERFILE_LINT_RESULT" "$TERRAFORM_RESULT" "$BUILD_RESULT" "$E2E_RESULT" "$NON_DEMO_RESULT"; do
            test "$result" = "success"
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production API container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          tags: corvis-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Assert non-root standalone API runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "corvis"
          docker run --rm --entrypoint node "corvis-ci:${GITHUB_SHA}" --version
      - name: Start the released API container and probe /api/v1/health (#234)
        shell: bash
        run: |
          set -euo pipefail
          # No runtime surface is named, so the production container serves only
          # the health endpoint: this proves the standalone server boots.
          docker run -d --name corvis-smoke -p 3000:3000 "corvis-ci:${GITHUB_SHA}"
          trap 'docker logs corvis-smoke || true; docker rm -f corvis-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:3000/api/v1/health)"; then break; fi
            sleep 1
          done
          echo "${body:-}"
          echo "${body:-}" | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "404"
      # Known-fixable HIGH/CRITICAL vulnerabilities in the released image (OS
      # packages and bundled npm modules) fail the build (#236).
      - name: Image vulnerability scan (Trivy, pinned by digest)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "corvis-ci:${GITHUB_SHA}"
      - name: Build control-loop container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.control-loop
          pull: true
          load: true
          tags: corvis-control-loop-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-control-loop
          cache-to: type=gha,mode=max,scope=ci-control-loop
      - name: Assert non-root control-loop runtime and execute scanner smoke test
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-control-loop-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node "corvis-control-loop-ci:${GITHUB_SHA}" --version
          docker run --rm "corvis-control-loop-ci:${GITHUB_SHA}" --mode daily --evidence /tmp/control-loop-smoke.json >/tmp/control-loop-smoke.stdout
          grep -q '"schemaVersion"' /tmp/control-loop-smoke.stdout
      - name: Control-loop image vulnerability scan (Trivy, pinned by digest)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "corvis-control-loop-ci:${GITHUB_SHA}"

  rate-limit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Apply full Postgres migration chain on a clean database
        shell: bash
        run: |
          set -euo pipefail
          createdb corvis_migration_smoke
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/supabase-auth-fixture.sql
          for migration in db/postgres/migrations/*.sql; do
            echo "Applying ${migration}"
            PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - run: npm ci --prefer-offline --no-audit
      - name: Apply full migration chain through the production runner, twice
        shell: bash
        run: |
          set -euo pipefail
          # Raw psql above never enforces the runner's one-transaction contract or
          # its ledger, so exercise the exact path deploys use. The second run
          # must be a clean no-op.
          createdb corvis_runner_smoke
          PGDATABASE=corvis_runner_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/supabase-auth-fixture.sql
          export CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_runner_smoke?sslmode=disable"
          node db/postgres/migrate.ts --apply > runner-first.json
          node db/postgres/migrate.ts --apply > runner-second.json
          node -e 'const r=require("fs");const a=JSON.parse(r.readFileSync("runner-first.json","utf8"));const b=JSON.parse(r.readFileSync("runner-second.json","utf8"));if(a.result!=="pass"||b.result!=="pass"||b.applied.length!==0||a.applied.length===0)process.exit(1)'
      - name: Exercise reviewed economic graph canonicalization
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/reviewed-economic-graph.sql
      - name: Exercise processing retry exhaustion and delivery hardening
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/processing-retry-exhaustion.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/processing-stage-recovery-hardening.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/outbox-event-authenticity-guard.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/sector-taxonomy.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/tenant-invitation-acceptance.sql
      - name: Exercise the RLS invariant and the end-to-end processing stage pipeline
        shell: bash
        run: |
          set -euo pipefail
          # Every corvis_* table must have RLS enabled and forced (documented global tables allow-listed).
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rls-invariant.sql
          # canonicalize -> reconcile -> consolidate -> publish, replay safety, and correction replay. Rolled back.
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/processing-stage-pipeline.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/integrity-hardening.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/pipeline-durability-066.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/release-clean-artifact-guard.sql
          # Export download grants are subject-, tenant-, token- and expiry-bound in the real redemption SQL. Rolled back.
          CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_migration_smoke?sslmode=disable" node db/postgres/tests/export-grant-redemption.mjs
          # Email notifications: recipient capture, preferences, send-time eligibility, digests. Rolled back.
          CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_migration_smoke?sslmode=disable" node db/postgres/tests/email-notifications.mjs
          # Recorded research scopes and attack-mode SCIM caches cannot outlive revoked authority. Rolled back.
          CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_migration_smoke?sslmode=disable" node db/postgres/tests/authorization-cache-revocation.mjs
          # Migration 073 corrects the audit rows 069 mislabelled; append-only audit means it is exercised in a rolled-back transaction.
          CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_migration_smoke?sslmode=disable" node db/postgres/tests/migration-073-audit-correction.mjs
      - name: Exercise RLS tenant-isolation negatives as a non-owner role
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/tenant-isolation-negative.sql
      # The same RLS acceptance probe the deploy workflow runs against live
      # environments, on every PR (#234). Supabase provides the `authenticated`
      # role; vanilla Postgres needs it created. The probe grants and rolls back.
      - name: Postgres RLS security acceptance (security_acceptance.sql)
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if; end \$\$;"
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/security_acceptance.sql | tee security-acceptance.out
          grep -q POSTGRES_RLS_SECURITY_ACCEPTANCE_PASS security-acceptance.out
      - name: Apply isolated rate-limit migration and acceptance checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate-limit-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/020_distributed_api_rate_limit.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate_limit.sql
      - name: Verify concurrent independent database connections
        run: node db/postgres/tests/rate-limit-concurrency.mjs
      - run: npm ci --prefer-offline --no-audit
      - name: Verify user preference ownership and workspace sharing
        run: CORVIS_POSTGRES_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/corvis_migration_smoke?sslmode=disable" node db/postgres/tests/user-preferences.mjs
      - name: Verify native application Postgres adapter
        env:
          CORVIS_POSTGRES_DSN: postgresql://postgres:ci-disposable-only@localhost:5432/postgres?sslmode=disable
        run: node db/postgres/tests/native-adapter.mjs
