name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

# No job writes to the repository, checks, PRs or security events; actions/cache
# and BuildKit type=gha caches use the runner cache token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.txt
      - name: Preserve unit-test failure transcript
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-output-${{ github.run_id }}
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Dependency audit
        run: npm audit --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"
      - name: Terraform format and provider validation
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          mapfile -t roots < <(find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" -gt 0
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Cache Next.js compiler output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Install browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e

  # Keep the historic required-check context stable while the expensive gates run
  # independently. Every prior frontend check remains blocking through this fan-in.
  frontend:
    needs: [quality, terraform, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all frontend gates passed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$TERRAFORM_RESULT" "$BUILD_RESULT" "$E2E_RESULT"; do
            test "$result" = "success"
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production API container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          tags: corvis-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Assert non-root standalone API runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "corvis"
          docker run --rm --entrypoint node "corvis-ci:${GITHUB_SHA}" --version
      - name: Build control-loop container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.control-loop
          pull: true
          load: true
          tags: corvis-control-loop-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-control-loop
          cache-to: type=gha,mode=max,scope=ci-control-loop
      - name: Assert non-root control-loop runtime and execute scanner smoke test
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-control-loop-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node "corvis-control-loop-ci:${GITHUB_SHA}" --version
          docker run --rm "corvis-control-loop-ci:${GITHUB_SHA}" --mode daily --evidence /tmp/control-loop-smoke.json >/tmp/control-loop-smoke.stdout
          grep -q '"schemaVersion"' /tmp/control-loop-smoke.stdout

  rate-limit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Apply full Postgres migration chain on a clean database
        shell: bash
        run: |
          set -euo pipefail
          createdb corvis_migration_smoke
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/supabase-auth-fixture.sql
          for migration in db/postgres/migrations/*.sql; do
            echo "Applying ${migration}"
            PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Exercise reviewed economic graph canonicalization
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/reviewed-economic-graph.sql
      - name: Exercise processing retry exhaustion and delivery hardening
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/processing-retry-exhaustion.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/processing-stage-recovery-hardening.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/outbox-event-authenticity-guard.sql
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/sector-taxonomy.sql
      - name: Exercise RLS tenant-isolation negatives as a non-owner role
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/tenant-isolation-negative.sql
      - name: Apply isolated rate-limit migration and acceptance checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate-limit-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/020_distributed_api_rate_limit.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate_limit.sql
      - name: Verify concurrent independent database connections
        run: node db/postgres/tests/rate-limit-concurrency.mjs
      - run: npm ci --prefer-offline --no-audit
      - name: Verify native application Postgres adapter
        env:
          CORVIS_POSTGRES_DSN: postgresql://postgres:ci-disposable-only@localhost:5432/postgres?sslmode=disable
        run: node db/postgres/tests/native-adapter.mjs
