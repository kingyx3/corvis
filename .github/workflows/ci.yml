name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORVIS_DEMO_MODE: "true"
      NEXT_PUBLIC_CORVIS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.txt
      - name: Preserve unit-test failure transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-${{ github.run_id }}
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 14
      - name: Terraform format and provider validation
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          mapfile -t roots < <(find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" -gt 0
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done
      - name: Cache Next.js compiler output
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Install browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build production API container
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: corvis-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Assert non-root standalone API runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "corvis"
          docker run --rm --entrypoint node "corvis-ci:${GITHUB_SHA}" --version
      - name: Build control-loop container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control-loop
          pull: true
          load: true
          tags: corvis-control-loop-ci:${{ github.sha }}
          cache-from: type=gha,scope=ci-control-loop
          cache-to: type=gha,mode=max,scope=ci-control-loop
      - name: Assert non-root control-loop runtime and execute scanner smoke test
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "corvis-control-loop-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node "corvis-control-loop-ci:${GITHUB_SHA}" --version
          docker run --rm "corvis-control-loop-ci:${GITHUB_SHA}" --mode daily --evidence /tmp/control-loop-smoke.json >/tmp/control-loop-smoke.stdout
          grep -q '"schemaVersion"' /tmp/control-loop-smoke.stdout

  rate-limit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply full Postgres migration chain on a clean database
        shell: bash
        run: |
          set -euo pipefail
          createdb corvis_migration_smoke
          PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/supabase-auth-fixture.sql
          for migration in db/postgres/migrations/*.sql; do
            echo "Applying ${migration}"
            PGDATABASE=corvis_migration_smoke psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Apply isolated rate-limit migration and acceptance checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate-limit-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/020_distributed_api_rate_limit.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/rate_limit.sql
      - name: Verify concurrent independent database connections
        run: node db/postgres/tests/rate-limit-concurrency.mjs
      - run: npm ci
      - name: Verify native application Postgres adapter
        env:
          CORVIS_POSTGRES_DSN: postgresql://postgres:ci-disposable-only@localhost:5432/postgres?sslmode=disable
        run: node db/postgres/tests/native-adapter.mjs
