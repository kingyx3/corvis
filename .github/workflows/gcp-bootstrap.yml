name: Bootstrap GCP foundation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, uat, prod]
        default: uat
      action:
        description: Bootstrap action
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      allow_destroy:
        description: Acknowledge plan deletes/replaces existing resources (dev/uat only; refused for prod)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      TF_STATE_BUCKET: ${{ format('{0}-corvis-tf-state', vars.GCP_PROJECT_ID) }}
      TF_ROOT: infra/terraform/environments/${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_source_bucket_name: ${{ format('{0}-documents', vars.GCP_PROJECT_ID) }}
      TF_VAR_api_image: ""
      TF_VAR_cloudflare_zone_name: ""
      TF_VAR_enable_cloudflare_managed_waf: "false"
      TF_VAR_decommission_mode: "false"
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID || '' }}
      TF_VAR_monthly_budget_amount_usd: ${{ vars.GCP_MONTHLY_BUDGET_USD || (inputs.environment == 'uat' && '5' || inputs.environment == 'prod' && '2000' || '500') }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.MONITORING_NOTIFICATION_CHANNEL_IDS || '[]' }}

    steps:
      - name: Validate bootstrap roots
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "Missing required GitHub Environment variable: GCP_PROJECT_ID"
            exit 1
          fi
          if [[ -z "${GCP_WIF_PROVIDER}" ]]; then
            echo "Missing required GitHub Environment variable: GCP_WIF_PROVIDER"
            exit 1
          fi
          if [[ ! "${TF_VAR_monthly_budget_amount_usd}" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk "BEGIN { exit !(${TF_VAR_monthly_budget_amount_usd} > 0) }"; then
            echo "GCP_MONTHLY_BUDGET_USD must be a positive numeric amount."
            exit 1
          fi
          if [[ "${{ inputs.action }}" == "apply" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Bootstrap apply is allowed only from main."
            exit 1
          fi
          if [[ "${ALLOW_DESTROY}" == "true" && "${{ inputs.environment }}" == "prod" ]]; then
            echo "allow_destroy is refused for prod. Use the guarded decommission workflow for intentional teardown."
            exit 1
          fi
          if [[ ! "${GCP_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "GCP_WIF_PROVIDER must be the full Google Workload Identity Provider resource name."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"

      - name: Verify keyless trust anchor
        shell: bash
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "${GCP_DEPLOY_SERVICE_ACCOUNT}" \
            --project="${GCP_PROJECT_ID}" >/dev/null

          mapfile -t user_keys < <(
            gcloud iam service-accounts keys list \
              --iam-account="${GCP_DEPLOY_SERVICE_ACCOUNT}" \
              --managed-by=user \
              --format='value(name)'
          )
          if (( ${#user_keys[@]} > 0 )); then
            echo "The deploy service account has user-managed keys. Corvis CI/CD is keyless; remove them before continuing."
            exit 1
          fi

          bash .github/scripts/verify-gcp-trust-anchor.sh

      - name: Bootstrap protected Terraform state
        run: bash .github/scripts/terraform-state.sh ensure

      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir="${TF_ROOT}" init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=corvis/${{ inputs.environment }}"

      - name: Re-adopt retained KMS bootstrap anchors
        run: bash .github/scripts/terraform-kms-state.sh adopt

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: terraform -chdir="${TF_ROOT}" validate

      - name: Plan keyless GCP foundation
        run: terraform -chdir="${TF_ROOT}" plan -lock-timeout=5m -out=bootstrap.tfplan

      # Bootstrap blanks the runtime inputs, so against an environment that
      # already runs a release the plan would destroy gateways/edge/scheduler.
      - name: Refuse destroy or replace of existing resources
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" show -json bootstrap.tfplan > "${RUNNER_TEMP}/bootstrap-plan.json"
          bash .github/scripts/assert-no-runtime-destroy.sh "${RUNNER_TEMP}/bootstrap-plan.json"

      - name: Apply keyless GCP foundation
        if: inputs.action == 'apply'
        run: terraform -chdir="${TF_ROOT}" apply -lock-timeout=5m -auto-approve bootstrap.tfplan

      - name: Verify bootstrap outputs
        if: inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${GCP_PROJECT_ID}-documents" --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud artifacts repositories describe corvis \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" >/dev/null
          gcloud iam service-accounts describe "corvis-api-${{ inputs.environment }}@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud iam service-accounts describe "corvis-worker-${{ inputs.environment }}@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud pubsub topics describe "document-registered-${{ inputs.environment }}" \
            --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud tasks queues describe "processing-${{ inputs.environment }}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" >/dev/null

      - name: Bootstrap summary
        if: always()
        shell: bash
        run: |
          {
            echo "### GCP foundation bootstrap"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Action: \`${{ inputs.action }}\`"
            echo "- Project: \`${GCP_PROJECT_ID}\`"
            echo "- WIF provider: \`${GCP_WIF_PROVIDER}\`"
            echo "- Deploy identity: \`${GCP_DEPLOY_SERVICE_ACCOUNT}\`"
            echo "- Monthly budget: \`$${TF_VAR_monthly_budget_amount_usd}\`"
            echo "- Terraform state: \`gs://${TF_STATE_BUCKET}\` (versioned; stale noncurrent versions lifecycle-managed)"
            echo "- Retained KMS anchors: automatically re-adopted after a prior full decommission"
            echo "- Runtime image: intentionally disabled during bootstrap"
            echo "- Cloudflare edge: intentionally disabled during bootstrap"
            echo "- Static GCP credential secret: not used"
            if [[ "${{ inputs.action }}" == "apply" ]]; then
              echo "- Next: populate runtime secret versions, run Build release image, then Terraform deploy with the built main SHA."
            else
              echo "- Next: review this plan, then rerun this workflow with action=apply."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
