name: UAT GCP cost control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect or resume an automatically hibernated UAT environment
        required: true
        type: choice
        options: [status, resume]
        default: status
      confirmation:
        description: For resume, enter exactly RESUME uat
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: uat-gcp-cost-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      COST_GUARD_SERVICE_ACCOUNT: ${{ format('corvis-cost-guard-uat@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GCP_PROJECT_ID}" && -n "${GCP_WIF_PROVIDER}" ]] || { echo "UAT GCP trust variables are required."; exit 1; }
          if [[ "${{ inputs.action }}" == "resume" && "${{ inputs.confirmation }}" != "RESUME uat" ]]; then
            echo "Resume requires confirmation: RESUME uat"
            exit 1
          fi

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - name: Inspect or resume UAT automation
        shell: bash
        run: |
          set -euo pipefail
          impersonate="--impersonate-service-account=${COST_GUARD_SERVICE_ACCOUNT}"
          scheduler_jobs=(
            corvis-delivery-uat
            corvis-control-loop-daily-uat
            corvis-control-loop-weekly-uat
            corvis-control-loop-monthly-uat
          )

          echo "### UAT cost-control state" >> "${GITHUB_STEP_SUMMARY}"
          for job in "${scheduler_jobs[@]}"; do
            if ! state="$(gcloud scheduler jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" ${impersonate} \
              --format='value(state)' 2>/dev/null)"; then
              echo "- Scheduler \`${job}\`: not present" >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi
            if [[ "${{ inputs.action }}" == "resume" && "${state}" == "PAUSED" ]]; then
              gcloud scheduler jobs resume "${job}" \
                --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" ${impersonate} --quiet
              state="ENABLED"
            fi
            echo "- Scheduler \`${job}\`: ${state}" >> "${GITHUB_STEP_SUMMARY}"
          done

          queue="processing-uat"
          if queue_state="$(gcloud tasks queues describe "${queue}" \
            --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" ${impersonate} \
            --format='value(state)' 2>/dev/null)"; then
            if [[ "${{ inputs.action }}" == "resume" && "${queue_state}" == "PAUSED" ]]; then
              gcloud tasks queues resume "${queue}" \
                --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" ${impersonate} --quiet
              queue_state="RUNNING"
            fi
            echo "- Cloud Tasks \`${queue}\`: ${queue_state}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Cloud Tasks \`${queue}\`: not present" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [[ "${{ inputs.action }}" == "resume" ]]; then
            echo "UAT automated consumption was resumed without recreating or deleting infrastructure." >> "${GITHUB_STEP_SUMMARY}"
          fi
