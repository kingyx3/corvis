name: Runtime secret readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, uat, prod]
      action:
        description: Secret lifecycle action
        required: true
        type: choice
        options: [audit, rotate-gateway-identity]
        default: audit

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  runtime-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      POSTGRES_DSN_SECRET: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      GATEWAY_IDENTITY_SECRET: ${{ format('corvis-gateway-identity-{0}', inputs.environment) }}
    steps:
      - name: Validate trust roots
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          [[ -n "${GCP_PROJECT_ID}" ]] || { echo "Missing GCP_PROJECT_ID"; exit 1; }
          [[ -n "${GCP_WIF_PROVIDER}" ]] || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }

      - name: Guard secret rotation source
        if: inputs.action != 'audit' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Runtime secret mutation is allowed only from main."
          exit 1

      - uses: actions/checkout@v7

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Require Terraform-managed secret containers
        shell: bash
        run: |
          set -euo pipefail
          for secret in "${POSTGRES_DSN_SECRET}" "${GATEWAY_IDENTITY_SECRET}"; do
            if ! gcloud secrets describe "${secret}" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing Terraform-managed Secret Manager container: ${secret}"
              exit 1
            fi
          done

      - name: Rotate gateway identity secret
        if: inputs.action == 'rotate-gateway-identity'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "${secret_file}"' EXIT
          openssl rand -base64 48 > "${secret_file}"
          gcloud secrets versions add "${GATEWAY_IDENTITY_SECRET}" \
            --project="${GCP_PROJECT_ID}" \
            --data-file="${secret_file}" >/dev/null
          echo "Gateway identity secret rotated; value was generated locally and was not written to logs, GitHub outputs, artifacts, or Terraform state."

      - name: Audit enabled runtime versions
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for secret in "${POSTGRES_DSN_SECRET}" "${GATEWAY_IDENTITY_SECRET}"; do
            version="$(gcloud secrets versions list "${secret}" \
              --project="${GCP_PROJECT_ID}" \
              --filter='state=ENABLED' \
              --sort-by='~createTime' \
              --limit=1 \
              --format='value(name)')"
            if [[ -z "${version}" ]]; then
              echo "::error::${secret} has no enabled runtime version."
              failed=1
            else
              echo "${secret}: enabled version present (${version##*/}); value not accessed."
            fi
          done
          [[ "${failed}" -eq 0 ]]

      - name: Record readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Runtime secret lifecycle"
            echo "- Environment: `${{ inputs.environment }}`"
            echo "- Action: `${{ inputs.action }}`"
            echo "- Secret values are never read by the audit path."
            echo "- Postgres DSN provisioning remains owned by the controlled Supabase/Postgres activation path."
          } >> "${GITHUB_STEP_SUMMARY}"
