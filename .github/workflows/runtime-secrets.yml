name: Runtime secret readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, uat, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  runtime-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      POSTGRES_DSN_SECRET: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      POSTGRES_MIGRATION_DSN_SECRET: ${{ format('corvis-postgres-migration-dsn-{0}', inputs.environment) }}
    steps:
      - name: Validate trust roots
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          [[ -n "${GCP_PROJECT_ID}" ]] || { echo "Missing GCP_PROJECT_ID"; exit 1; }
          [[ -n "${GCP_WIF_PROVIDER}" ]] || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Require Terraform-managed Postgres secret container
        shell: bash
        run: |
          set -euo pipefail
          for secret_id in "${POSTGRES_DSN_SECRET}" "${POSTGRES_MIGRATION_DSN_SECRET}"; do
            if ! gcloud secrets describe "${secret_id}" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing Terraform-managed Secret Manager container: ${secret_id}"
              echo "Apply the reviewed GCP foundation before provider activation."
              exit 1
            fi
          done

      - name: Audit enabled runtime version
        shell: bash
        run: |
          bash tools/ci/require-secret-latest.sh "${POSTGRES_DSN_SECRET}" "${POSTGRES_MIGRATION_DSN_SECRET}"

      - name: Record readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Runtime secret readiness"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Canonical Postgres secret: \`${POSTGRES_DSN_SECRET}\`"
            echo "- Deploy-only migration secret: \`${POSTGRES_MIGRATION_DSN_SECRET}\`"
            echo "- Secret values are never read by this audit workflow."
            echo "- User OIDC configuration is non-secret GitHub Environment configuration."
            echo "- Internal worker calls use Google workload OIDC; no shared worker secret is required in production."
          } >> "${GITHUB_STEP_SUMMARY}"
