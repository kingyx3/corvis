name: Build release image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build registry; production-like releases are built once in UAT and copied to prod
        required: true
        type: choice
        options: [dev, uat]
        default: dev

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: corvis
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      LITELLM_BASE_IMAGE: ${{ vars.CORVIS_LITELLM_BASE_IMAGE }}
    steps:
      - name: Guard release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release images may only be built from main."
            exit 1
          fi
          case "${{ inputs.environment }}" in
            dev|uat) ;;
            *) echo "Release builds are prohibited in prod; build once in UAT and copy the exact image set."; exit 1 ;;
          esac
          if [[ -z "${GCP_PROJECT_ID}" || -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "GCP_PROJECT_ID and GCP_WIF_PROVIDER are required in the selected GitHub Environment."
            exit 1
          fi
          if [[ ! "${LITELLM_BASE_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "CORVIS_LITELLM_BASE_IMAGE must be an immutable LiteLLM image reference ending in @sha256:<digest>."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify effective release governance
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
        run: node .github/scripts/release-governance.mjs

      - name: Authenticate to GCP with Workload Identity Federation
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - name: Verify Artifact Registry repository
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" >/dev/null

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare immutable image references
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          for image in api control-loop extractor litellm; do
            repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${image}"
            key="${image//-/_}"
            echo "${key}_image=${repo}" >> "${GITHUB_OUTPUT}"
            echo "${key}_tagged_ref=${repo}:git-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          done

      - name: Build and push immutable API image
        id: api_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.refs.outputs.api_tagged_ref }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

      - name: Build and push immutable control-loop image
        id: control_loop_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.control-loop
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.refs.outputs.control_loop_tagged_ref }}
          cache-from: type=gha,scope=release-control-loop
          cache-to: type=gha,mode=max,scope=release-control-loop

      - name: Build and push immutable extractor image
        id: extractor_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.extractor
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.refs.outputs.extractor_tagged_ref }}
          cache-from: type=gha,scope=release-extractor
          cache-to: type=gha,mode=max,scope=release-extractor

      - name: Build and push immutable LiteLLM gateway image
        id: litellm_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ops/litellm
          file: ops/litellm/Dockerfile
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.refs.outputs.litellm_tagged_ref }}
          build-args: |
            LITELLM_BASE_IMAGE=${{ env.LITELLM_BASE_IMAGE }}
          cache-from: type=gha,scope=release-litellm
          cache-to: type=gha,mode=max,scope=release-litellm

      - name: Verify immutable image digests
        id: verified
        shell: bash
        env:
          API_IMAGE: ${{ steps.refs.outputs.api_image }}
          API_TAGGED: ${{ steps.refs.outputs.api_tagged_ref }}
          API_BUILDX: ${{ steps.api_build.outputs.digest }}
          CONTROL_LOOP_IMAGE: ${{ steps.refs.outputs.control_loop_image }}
          CONTROL_LOOP_TAGGED: ${{ steps.refs.outputs.control_loop_tagged_ref }}
          CONTROL_LOOP_BUILDX: ${{ steps.control_loop_build.outputs.digest }}
          EXTRACTOR_IMAGE: ${{ steps.refs.outputs.extractor_image }}
          EXTRACTOR_TAGGED: ${{ steps.refs.outputs.extractor_tagged_ref }}
          EXTRACTOR_BUILDX: ${{ steps.extractor_build.outputs.digest }}
          LITELLM_IMAGE: ${{ steps.refs.outputs.litellm_image }}
          LITELLM_TAGGED: ${{ steps.refs.outputs.litellm_tagged_ref }}
          LITELLM_BUILDX: ${{ steps.litellm_build.outputs.digest }}
        run: |
          set -euo pipefail
          verify() {
            local key="$1" image="$2" tagged="$3" buildx="$4"
            local digest
            digest="$(gcloud artifacts docker images describe "${tagged}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Artifact Registry returned an invalid ${key} digest."; exit 1; }
            [[ "${digest}" == "${buildx}" ]] || { echo "BuildKit and Artifact Registry ${key} digests disagree."; exit 1; }
            gcloud artifacts docker images describe "${image}@${digest}" --project="${GCP_PROJECT_ID}" >/dev/null
            echo "${key}_image=${image}" >> "${GITHUB_OUTPUT}"
            echo "${key}_digest=${digest}" >> "${GITHUB_OUTPUT}"
            echo "${key}_digest_ref=${image}@${digest}" >> "${GITHUB_OUTPUT}"
            echo "${key}_tagged_ref=${tagged}" >> "${GITHUB_OUTPUT}"
          }
          verify api "${API_IMAGE}" "${API_TAGGED}" "${API_BUILDX}"
          verify control_loop "${CONTROL_LOOP_IMAGE}" "${CONTROL_LOOP_TAGGED}" "${CONTROL_LOOP_BUILDX}"
          verify extractor "${EXTRACTOR_IMAGE}" "${EXTRACTOR_TAGGED}" "${EXTRACTOR_BUILDX}"
          verify litellm "${LITELLM_IMAGE}" "${LITELLM_TAGGED}" "${LITELLM_BUILDX}"

      - name: Attest API build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.verified.outputs.api_image }}
          subject-digest: ${{ steps.verified.outputs.api_digest }}
          push-to-registry: true

      - name: Attest control-loop build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.verified.outputs.control_loop_image }}
          subject-digest: ${{ steps.verified.outputs.control_loop_digest }}
          push-to-registry: true

      - name: Attest extractor build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.verified.outputs.extractor_image }}
          subject-digest: ${{ steps.verified.outputs.extractor_digest }}
          push-to-registry: true

      - name: Attest LiteLLM build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.verified.outputs.litellm_image }}
          subject-digest: ${{ steps.verified.outputs.litellm_digest }}
          push-to-registry: true

      - name: Capture release metadata
        shell: bash
        env:
          API_DIGEST_REF: ${{ steps.verified.outputs.api_digest_ref }}
          API_TAGGED_REF: ${{ steps.verified.outputs.api_tagged_ref }}
          API_DIGEST: ${{ steps.verified.outputs.api_digest }}
          CONTROL_LOOP_DIGEST_REF: ${{ steps.verified.outputs.control_loop_digest_ref }}
          CONTROL_LOOP_TAGGED_REF: ${{ steps.verified.outputs.control_loop_tagged_ref }}
          CONTROL_LOOP_DIGEST: ${{ steps.verified.outputs.control_loop_digest }}
          EXTRACTOR_DIGEST_REF: ${{ steps.verified.outputs.extractor_digest_ref }}
          EXTRACTOR_TAGGED_REF: ${{ steps.verified.outputs.extractor_tagged_ref }}
          EXTRACTOR_DIGEST: ${{ steps.verified.outputs.extractor_digest }}
          LITELLM_DIGEST_REF: ${{ steps.verified.outputs.litellm_digest_ref }}
          LITELLM_TAGGED_REF: ${{ steps.verified.outputs.litellm_tagged_ref }}
          LITELLM_DIGEST: ${{ steps.verified.outputs.litellm_digest }}
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg schemaVersion "corvis.release-image.v4" \
            --arg environment "${{ inputs.environment }}" \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg image "${API_DIGEST_REF}" \
            --arg taggedImage "${API_TAGGED_REF}" \
            --arg digest "${API_DIGEST}" \
            --arg controlLoopImage "${CONTROL_LOOP_DIGEST_REF}" \
            --arg controlLoopTaggedImage "${CONTROL_LOOP_TAGGED_REF}" \
            --arg controlLoopDigest "${CONTROL_LOOP_DIGEST}" \
            --arg extractorImage "${EXTRACTOR_DIGEST_REF}" \
            --arg extractorTaggedImage "${EXTRACTOR_TAGGED_REF}" \
            --arg extractorDigest "${EXTRACTOR_DIGEST}" \
            --arg litellmImage "${LITELLM_DIGEST_REF}" \
            --arg litellmTaggedImage "${LITELLM_TAGGED_REF}" \
            --arg litellmDigest "${LITELLM_DIGEST}" \
            --arg builtAt "${built_at}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            '{schemaVersion:$schemaVersion,environment:$environment,sourceSha:$sourceSha,image:$image,taggedImage:$taggedImage,digest:$digest,controlLoopImage:$controlLoopImage,controlLoopTaggedImage:$controlLoopTaggedImage,controlLoopDigest:$controlLoopDigest,extractorImage:$extractorImage,extractorTaggedImage:$extractorTaggedImage,extractorDigest:$extractorDigest,litellmImage:$litellmImage,litellmTaggedImage:$litellmTaggedImage,litellmDigest:$litellmDigest,builtAt:$builtAt,workflowRunId:$workflowRunId,attestation:"github-actions+buildkit-provenance",sbom:"buildkit-spdx"}' > release-image.json

          {
            echo "### Immutable release images"
            echo "- Build registry: \`${{ inputs.environment }}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- API/worker: \`${API_DIGEST_REF}\`"
            echo "- Control loop: \`${CONTROL_LOOP_DIGEST_REF}\`"
            echo "- Extractor: \`${EXTRACTOR_DIGEST_REF}\`"
            echo "- LiteLLM: \`${LITELLM_DIGEST_REF}\`"
            echo "- Build provenance: BuildKit max-mode plus GitHub artifact attestations for all four images"
            echo "- SBOM: BuildKit SPDX attestations embedded with all four OCI images"
            if [[ "${{ inputs.environment }}" == "uat" ]]; then
              echo "- Production promotion: copy these exact OCI digests; do not rebuild"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ inputs.environment }}-${{ github.sha }}
          path: release-image.json
          if-no-files-found: error
          retention-days: 90
