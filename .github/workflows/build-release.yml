name: Build release image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build registry; production-like releases are built once in UAT and copied to prod
        required: true
        type: choice
        options: [dev, uat]
        default: dev

permissions:
  contents: read
  checks: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: build-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: corvis
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Guard release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release images may only be built from main."
            exit 1
          fi
          case "${{ inputs.environment }}" in
            dev|uat) ;;
            *) echo "Release builds are prohibited in prod; build once in UAT and copy the exact image set."; exit 1 ;;
          esac
          if [[ -z "${GCP_PROJECT_ID}" || -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "GCP_PROJECT_ID and GCP_WIF_PROVIDER are required in the selected GitHub Environment."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Verify effective release governance
        env:
          # Ruleset bypass_actors are only returned to callers with ruleset
          # write access, which the workflow GITHUB_TOKEN can never hold.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
        run: node .github/scripts/release-governance.mjs

      - name: Authenticate to GCP with Workload Identity Federation
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify Artifact Registry repository
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" >/dev/null

      # Write a static `auths` entry (not a gcloud credHelper): actions/attest
      # push-to-registry reads only `auths` from ~/.docker/config.json, and
      # BuildKit pushes use the same short-lived WIF access token.
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Prepare immutable image references
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          api_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api"
          control_loop_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/control-loop"
          echo "api_image=${api_image}" >> "${GITHUB_OUTPUT}"
          echo "api_tagged_ref=${api_image}:git-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "control_loop_image=${control_loop_image}" >> "${GITHUB_OUTPUT}"
          echo "control_loop_tagged_ref=${control_loop_image}:git-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable API image
        id: api_build
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.refs.outputs.api_tagged_ref }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

      - name: Verify immutable API image
        id: api
        shell: bash
        env:
          IMAGE: ${{ steps.refs.outputs.api_image }}
          TAGGED_REF: ${{ steps.refs.outputs.api_tagged_ref }}
          BUILDX_DIGEST: ${{ steps.api_build.outputs.digest }}
        run: |
          set -euo pipefail
          registry_digest="$(gcloud artifacts docker images describe "${TAGGED_REF}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          [[ "${registry_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Artifact Registry did not return a valid API digest."; exit 1; }
          [[ "${registry_digest}" == "${BUILDX_DIGEST}" ]] || { echo "BuildKit and Artifact Registry API digests disagree."; exit 1; }
          digest_ref="${IMAGE}@${registry_digest}"
          gcloud artifacts docker images describe "${digest_ref}" --project="${GCP_PROJECT_ID}" >/dev/null
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${registry_digest}" >> "${GITHUB_OUTPUT}"
          echo "digest_ref=${digest_ref}" >> "${GITHUB_OUTPUT}"
          echo "tagged_ref=${TAGGED_REF}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable control-loop image
        id: control_loop_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control-loop
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.refs.outputs.control_loop_tagged_ref }}
          cache-from: type=gha,scope=release-control-loop
          cache-to: type=gha,mode=max,scope=release-control-loop

      - name: Verify immutable control-loop image
        id: control_loop
        shell: bash
        env:
          IMAGE: ${{ steps.refs.outputs.control_loop_image }}
          TAGGED_REF: ${{ steps.refs.outputs.control_loop_tagged_ref }}
          BUILDX_DIGEST: ${{ steps.control_loop_build.outputs.digest }}
        run: |
          set -euo pipefail
          registry_digest="$(gcloud artifacts docker images describe "${TAGGED_REF}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          [[ "${registry_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Artifact Registry did not return a valid control-loop digest."; exit 1; }
          [[ "${registry_digest}" == "${BUILDX_DIGEST}" ]] || { echo "BuildKit and Artifact Registry control-loop digests disagree."; exit 1; }
          digest_ref="${IMAGE}@${registry_digest}"
          gcloud artifacts docker images describe "${digest_ref}" --project="${GCP_PROJECT_ID}" >/dev/null
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${registry_digest}" >> "${GITHUB_OUTPUT}"
          echo "digest_ref=${digest_ref}" >> "${GITHUB_OUTPUT}"
          echo "tagged_ref=${TAGGED_REF}" >> "${GITHUB_OUTPUT}"

      - name: Attest API build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.api.outputs.image }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest control-loop build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.control_loop.outputs.image }}
          subject-digest: ${{ steps.control_loop.outputs.digest }}
          push-to-registry: true

      - name: Capture release metadata
        shell: bash
        env:
          API_DIGEST_REF: ${{ steps.api.outputs.digest_ref }}
          API_TAGGED_REF: ${{ steps.api.outputs.tagged_ref }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          CONTROL_LOOP_DIGEST_REF: ${{ steps.control_loop.outputs.digest_ref }}
          CONTROL_LOOP_TAGGED_REF: ${{ steps.control_loop.outputs.tagged_ref }}
          CONTROL_LOOP_DIGEST: ${{ steps.control_loop.outputs.digest }}
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg schemaVersion "corvis.release-image.v2" \
            --arg environment "${{ inputs.environment }}" \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg image "${API_DIGEST_REF}" \
            --arg taggedImage "${API_TAGGED_REF}" \
            --arg digest "${API_DIGEST}" \
            --arg controlLoopImage "${CONTROL_LOOP_DIGEST_REF}" \
            --arg controlLoopTaggedImage "${CONTROL_LOOP_TAGGED_REF}" \
            --arg controlLoopDigest "${CONTROL_LOOP_DIGEST}" \
            --arg builtAt "${built_at}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            '{schemaVersion:$schemaVersion,environment:$environment,sourceSha:$sourceSha,image:$image,taggedImage:$taggedImage,digest:$digest,controlLoopImage:$controlLoopImage,controlLoopTaggedImage:$controlLoopTaggedImage,controlLoopDigest:$controlLoopDigest,builtAt:$builtAt,workflowRunId:$workflowRunId,attestation:"github-actions"}' \
            > release-image.json

          {
            echo "### Immutable release images"
            echo "- Build registry: `${{ inputs.environment }}`"
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- API/worker image: `${API_DIGEST_REF}`"
            echo "- Control-loop image: `${CONTROL_LOOP_DIGEST_REF}`"
            echo "- Build provenance: GitHub artifact attestations for both images"
            if [[ "${{ inputs.environment }}" == "uat" ]]; then
              echo "- Production promotion: copy these exact OCI digests; do not rebuild"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ inputs.environment }}-${{ github.sha }}
          path: release-image.json
          if-no-files-found: error
          retention-days: 90
