name: Build release image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Artifact Registry environment to publish into
        required: true
        type: choice
        options: [dev, uat, prod]
        default: dev

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: build-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: corvis
      IMAGE_NAME: api
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Guard release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release images may only be built from main."
            exit 1
          fi
          if [[ -z "${GCP_PROJECT_ID}" || -z "${{ vars.GCP_WIF_PROVIDER }}" ]]; then
            echo "GCP_PROJECT_ID and GCP_WIF_PROVIDER are required in the selected GitHub Environment."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Configure Artifact Registry authentication
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" >/dev/null
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          tag="git-${GITHUB_SHA}"
          tagged_ref="${image}:${tag}"

          docker build --pull --tag "${tagged_ref}" .
          docker push "${tagged_ref}"

          digest="$(gcloud artifacts docker images describe "${tagged_ref}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registry did not return a valid immutable digest."
            exit 1
          fi

          digest_ref="${image}@${digest}"
          gcloud artifacts docker images describe "${digest_ref}" \
            --project="${GCP_PROJECT_ID}" >/dev/null

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "digest_ref=${digest_ref}" >> "${GITHUB_OUTPUT}"
          echo "tagged_ref=${tagged_ref}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Capture release metadata
        shell: bash
        env:
          IMAGE_DIGEST_REF: ${{ steps.image.outputs.digest_ref }}
          IMAGE_TAGGED_REF: ${{ steps.image.outputs.tagged_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg schemaVersion "corvis.release-image.v1" \
            --arg environment "${{ inputs.environment }}" \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg image "${IMAGE_DIGEST_REF}" \
            --arg taggedImage "${IMAGE_TAGGED_REF}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg builtAt "${built_at}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            '{schemaVersion:$schemaVersion,environment:$environment,sourceSha:$sourceSha,image:$image,taggedImage:$taggedImage,digest:$digest,builtAt:$builtAt,workflowRunId:$workflowRunId,attestation:"github-actions"}' \
            > release-image.json

          {
            echo "### Immutable release image"
            echo "- Environment registry: `${{ inputs.environment }}`"
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- Image: `${IMAGE_DIGEST_REF}`"
            echo "- Build provenance: GitHub artifact attestation"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ inputs.environment }}-${{ github.sha }}
          path: release-image.json
          if-no-files-found: error
          retention-days: 90
