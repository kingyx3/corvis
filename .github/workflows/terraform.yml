name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/actions/setup-terraform-cached/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-deploy.yml"
      - ".github/workflows/cloudflare-zone-policy.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/actions/setup-terraform-cached/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-deploy.yml"
      - ".github/workflows/cloudflare-zone-policy.yml"

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            {
              find infra/terraform/environments -mindepth 1 -maxdepth 1 -type d
              if [[ -d infra/terraform/shared ]]; then
                find infra/terraform/shared -mindepth 1 -maxdepth 1 -type d
              fi
            } | sort
          )
          if [ ${#roots[@]} -eq 0 ]; then
            echo "No Terraform roots are implemented."
            exit 1
          fi
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done
