name: AI integration secret provisioning

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target production-like GitHub Environment
        required: true
        type: choice
        options: [uat, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-integration-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      AI_PROVIDER_SECRET_ID: ${{ format('corvis-ai-provider-credentials-{0}', inputs.environment) }}
      LITELLM_MASTER_SECRET_ID: ${{ format('corvis-litellm-master-key-{0}', inputs.environment) }}
      ATLASSIAN_SKILL_READ_SECRET_ID: ${{ format('corvis-atlassian-skill-read-{0}', inputs.environment) }}
      ATLASSIAN_SKILL_UPDATE_SECRET_ID: ${{ format('corvis-atlassian-skill-update-{0}', inputs.environment) }}
    steps:
      - name: Validate trust roots
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          [[ -n "${GCP_PROJECT_ID}" ]] || { echo "Missing GCP_PROJECT_ID"; exit 1; }
          [[ -n "${GCP_WIF_PROVIDER}" ]] || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - name: Sync configured AI integration secrets
        shell: bash
        env:
          AI_PROVIDER_CREDENTIALS: ${{ secrets.CORVIS_AI_PROVIDER_CREDENTIALS_JSON }}
          LITELLM_MASTER_KEY: ${{ secrets.CORVIS_LITELLM_MASTER_KEY }}
          ATLASSIAN_SKILL_READ_CREDENTIALS: ${{ secrets.CORVIS_ATLASSIAN_SKILL_READ_CREDENTIALS_JSON }}
          ATLASSIAN_SKILL_UPDATE_CREDENTIALS: ${{ secrets.CORVIS_ATLASSIAN_SKILL_UPDATE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          changed=0

          add_json_secret() {
            local value="$1"
            local secret_id="$2"
            local label="$3"
            [[ -n "${value}" ]] || return 0
            if ! jq -e 'type == "object"' >/dev/null <<<"${value}"; then
              echo "::error::${label} must be a JSON object."
              exit 1
            fi
            if ! printf '%s' "${value}" | gcloud secrets versions add "${secret_id}" \
              --project="${GCP_PROJECT_ID}" --data-file=- >/dev/null; then
              echo "::error::Could not add a version to ${secret_id}. Apply the environment Terraform first and verify the deploy identity has version-adder access."
              exit 1
            fi
            echo "Provisioned a new version for ${secret_id}."
            changed=1
          }

          add_string_secret() {
            local value="$1"
            local secret_id="$2"
            [[ -n "${value}" ]] || return 0
            if ! printf '%s' "${value}" | gcloud secrets versions add "${secret_id}" \
              --project="${GCP_PROJECT_ID}" --data-file=- >/dev/null; then
              echo "::error::Could not add a version to ${secret_id}. Apply the environment Terraform first and verify the deploy identity has version-adder access."
              exit 1
            fi
            echo "Provisioned a new version for ${secret_id}."
            changed=1
          }

          add_json_secret "${AI_PROVIDER_CREDENTIALS}" "${AI_PROVIDER_SECRET_ID}" "CORVIS_AI_PROVIDER_CREDENTIALS_JSON"
          add_string_secret "${LITELLM_MASTER_KEY}" "${LITELLM_MASTER_SECRET_ID}"
          add_json_secret "${ATLASSIAN_SKILL_READ_CREDENTIALS}" "${ATLASSIAN_SKILL_READ_SECRET_ID}" "CORVIS_ATLASSIAN_SKILL_READ_CREDENTIALS_JSON"
          add_json_secret "${ATLASSIAN_SKILL_UPDATE_CREDENTIALS}" "${ATLASSIAN_SKILL_UPDATE_SECRET_ID}" "CORVIS_ATLASSIAN_SKILL_UPDATE_CREDENTIALS_JSON"

          if [[ "${changed}" -eq 0 ]]; then
            echo "::error::No AI integration GitHub Environment secret was configured; refusing a no-op rotation."
            exit 1
          fi

      - name: Record provisioning summary
        if: always()
        shell: bash
        run: |
          {
            echo "### AI integration secret provisioning"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Provider credential container: \`${AI_PROVIDER_SECRET_ID}\`"
            echo "- LiteLLM master-key container: \`${LITELLM_MASTER_SECRET_ID}\`"
            echo "- Confluence skill read container: \`${ATLASSIAN_SKILL_READ_SECRET_ID}\`"
            echo "- Confluence skill update container: \`${ATLASSIAN_SKILL_UPDATE_SECRET_ID}\`"
            echo "- Secret values were never printed and are not stored in Terraform state."
            echo "- Read and update credentials remain separate so normal extraction can run without Confluence write authority."
          } >> "${GITHUB_STEP_SUMMARY}"
