name: Cloudflare shared zone policy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action for the shared Cloudflare zone policy
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-shared-zone-policy
  cancel-in-progress: false

jobs:
  # The policy is zone-wide and governs the prod hostnames too, so an apply must
  # clear the prod environment's required reviewers, not only UAT's (#235). The
  # state and GCP credentials stay in UAT (see below); this job only gates.
  prod-approval:
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    steps:
      - name: Record prod approval for the shared zone policy apply
        run: echo "Prod reviewers approved applying the shared Cloudflare zone policy from ${GITHUB_SHA}."

  terraform:
    needs: prod-approval
    if: ${{ always() && (needs.prod-approval.result == 'success' || (inputs.action == 'plan' && needs.prod-approval.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The independent shared-state bucket is anchored in the UAT GCP project so
    # the public edge can be prepared before prod bootstrap. It is a different
    # bucket from UAT environment state and is never deleted by UAT lifecycle.
    environment: uat
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      TF_IN_AUTOMATION: "true"
      TF_ROOT: infra/terraform/shared/cloudflare
      TF_STATE_BUCKET: ${{ format('{0}-corvis-shared-tf-state', vars.GCP_PROJECT_ID) }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      # No silent default: the managed WAF depends on the zone's plan (Pro+), so
      # the operator must record the choice explicitly as true or false (#235).
      TF_VAR_enable_cloudflare_managed_waf: ${{ vars.CLOUDFLARE_MANAGED_WAF_ENABLED }}
      TF_VAR_admin_allowed_cidrs: ${{ vars.CLOUDFLARE_ADMIN_ALLOWED_CIDRS || '[]' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_POLICY_TOKEN }}

    steps:
      - name: Validate shared zone request
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            plan|apply) ;;
            *) echo "Unsupported Terraform action: ${{ inputs.action }}"; exit 1 ;;
          esac
          if [[ -z "${GCP_PROJECT_ID}" || -z "${GCP_WIF_PROVIDER}" ]]; then
            echo "UAT GCP_PROJECT_ID and GCP_WIF_PROVIDER are required for protected shared Terraform state."
            exit 1
          fi
          if [[ -z "${TF_VAR_cloudflare_zone_name}" ]]; then
            echo "CLOUDFLARE_ZONE_NAME must be set before Cloudflare zone policy can be planned."
            exit 1
          fi
          if [[ "${TF_VAR_cloudflare_zone_name}" == http://* || "${TF_VAR_cloudflare_zone_name}" == https://* || "${TF_VAR_cloudflare_zone_name}" == */* || "${TF_VAR_cloudflare_zone_name}" == *\** ]]; then
            echo "CLOUDFLARE_ZONE_NAME must be a bare root zone name, not a URL, path or wildcard."
            exit 1
          fi
          if [[ "${TF_VAR_cloudflare_zone_name}" != "${TF_VAR_cloudflare_zone_name,,}" ]]; then
            echo "CLOUDFLARE_ZONE_NAME must be lowercase."
            exit 1
          fi
          case "${TF_VAR_enable_cloudflare_managed_waf}" in
            true|false) ;;
            *) echo "Set the CLOUDFLARE_MANAGED_WAF_ENABLED variable to true (Pro+ zone: managed Cloudflare/OWASP rules) or false (Free zone) explicitly."; exit 1 ;;
          esac
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"${TF_VAR_admin_allowed_cidrs}" >/dev/null; then
            echo "CLOUDFLARE_ADMIN_ALLOWED_CIDRS must be a JSON array of CIDR strings, e.g. [\"203.0.113.0/24\"]."
            exit 1
          fi
          if [[ "${TF_VAR_enable_cloudflare_managed_waf}" != "true" ]]; then
            echo "::warning::Managed Cloudflare/OWASP WAF rules are disabled for the shared zone (CLOUDFLARE_MANAGED_WAF_ENABLED=false)."
          fi
          if [[ "${TF_VAR_admin_allowed_cidrs}" == "[]" ]]; then
            echo "::warning::No admin IP allowlist (CLOUDFLARE_ADMIN_ALLOWED_CIDRS): admin hostnames are reachable from any address."
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_ZONE_POLICY_TOKEN is required. Keep zone-policy authority separate from UAT/prod DNS/Worker deployment tokens."
            exit 1
          fi

      - name: Guard apply source
        if: inputs.action == 'apply' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Shared Cloudflare policy apply is allowed only from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify effective release governance
        if: inputs.action == 'apply'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node .github/scripts/release-governance.mjs

      - name: Authenticate to GCP for shared Terraform state
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"

      - name: Ensure independent protected shared state
        run: bash .github/scripts/terraform-state.sh ensure

      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir="${TF_ROOT}" init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=corvis/cloudflare-zone-policy"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: terraform -chdir="${TF_ROOT}" validate

      - name: Terraform plan
        run: terraform -chdir="${TF_ROOT}" plan -lock-timeout=5m -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform -chdir="${TF_ROOT}" apply -lock-timeout=5m -auto-approve tfplan

      - name: Shared-zone summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Cloudflare shared zone policy"
            echo "- Action: \`${{ inputs.action }}\`"
            echo "- Root zone: \`${TF_VAR_cloudflare_zone_name}\`"
            echo "- State: \`gs://${TF_STATE_BUCKET}/corvis/cloudflare-zone-policy\`"
            echo "- Prod hostnames: \`api\`, \`app\`, \`admin\`"
            echo "- UAT hostnames: \`api-uat\`, \`app-uat\`, \`admin-uat\`"
            echo "- Managed WAF: \`${TF_VAR_enable_cloudflare_managed_waf}\`; minimum TLS: 1.2"
            echo "- Admin IP allowlist: \`${TF_VAR_admin_allowed_cidrs}\`"
            echo "- Environment DNS/Workers/routes remain owned by their environment Terraform states."
          } >> "${GITHUB_STEP_SUMMARY}"
