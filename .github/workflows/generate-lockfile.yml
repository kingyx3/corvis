name: Generate dependency lockfile

on:
  push:
    branches: [feature/enterprise-platform]
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enterprise-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock enterprise platform dependencies"
          git push origin HEAD:feature/enterprise-platform
