name: Dispatch UAT GCP bootstrap once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-uat-gcp-bootstrap-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch reviewed UAT bootstrap workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/gcp-bootstrap.yml/dispatches" \
            --data '{"ref":"main","inputs":{"environment":"uat","action":"apply","allow_destroy":"false"}}'
          echo "Dispatched gcp-bootstrap.yml for UAT apply with allow_destroy=false." >> "${GITHUB_STEP_SUMMARY}"
