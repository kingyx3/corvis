name: Security acceptance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production-like environment to verify
        required: true
        type: choice
        options: [uat, prod]
        default: uat
  workflow_call:
    inputs:
      environment:
        description: Production-like environment to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: security-acceptance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production-like environment
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            uat|prod) ;;
            *) echo "Security acceptance supports only uat or prod."; exit 1 ;;
          esac

  edge:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      GCP_REGION: asia-southeast1
      POSTGRES_DSN_SECRET_NAME: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      CORVIS_POSTGRES_CA_CERT: ${{ vars.CORVIS_POSTGRES_CA_CERT || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # scripts/collect-control-evidence.ts imports lib/server/postgres.ts -> pg.
      - name: Install control evidence runtime
        run: npm ci --ignore-scripts
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"
      - name: Derive API hostname
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ZONE_NAME}" ]]; then
            echo "CLOUDFLARE_ZONE_NAME is required for edge security acceptance."
            exit 1
          fi
          # Must match the hostname locals in infra/terraform/environments/<env>/main.tf.
          case "${CORVIS_ENVIRONMENT}" in
            prod)
              api_hostname="api.${CLOUDFLARE_ZONE_NAME}"
              customer_hostname="app.${CLOUDFLARE_ZONE_NAME}"
              admin_hostname="admin.${CLOUDFLARE_ZONE_NAME}"
              ;;
            uat)
              api_hostname="api-uat.${CLOUDFLARE_ZONE_NAME}"
              customer_hostname="app-uat.${CLOUDFLARE_ZONE_NAME}"
              admin_hostname="admin-uat.${CLOUDFLARE_ZONE_NAME}"
              ;;
            *) echo "Unsupported production-like environment: ${CORVIS_ENVIRONMENT}"; exit 1 ;;
          esac
          echo "API_HOSTNAME=${api_hostname}" >> "${GITHUB_ENV}"
          echo "CUSTOMER_HOSTNAME=${customer_hostname}" >> "${GITHUB_ENV}"
          echo "ADMIN_HOSTNAME=${admin_hostname}" >> "${GITHUB_ENV}"
      - name: Probe API and worker IAM boundaries
        shell: bash
        run: |
          set -euo pipefail
          gateway_hostname="$(gcloud api-gateway gateways describe "corvis-api-${CORVIS_ENVIRONMENT}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(defaultHostname)')"
          [[ -n "${gateway_hostname}" ]] || { echo "Unable to derive API Gateway hostname."; exit 1; }

          cloud_run_url="$(gcloud run services describe "corvis-api-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          worker_url="$(gcloud run services describe "corvis-worker-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          [[ -n "${cloud_run_url}" && -n "${worker_url}" ]] || { echo "Unable to derive Cloud Run service URLs."; exit 1; }

          gateway_service_account="corvis-gateway-${CORVIS_ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          expected_member="serviceAccount:${gateway_service_account}"
          iam_policy="$(gcloud run services get-iam-policy "corvis-api-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          mapfile -t invokers < <(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | unique[]' <<<"${iam_policy}")
          iam_boundary="fail"
          if [[ "${#invokers[@]}" -eq 1 && "${invokers[0]}" == "${expected_member}" ]]; then iam_boundary="pass"; fi

          worker_service_account="corvis-worker-${CORVIS_ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          expected_worker_member="serviceAccount:${worker_service_account}"
          worker_policy="$(gcloud run services get-iam-policy "corvis-worker-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          mapfile -t worker_invokers < <(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | unique[]' <<<"${worker_policy}")
          worker_iam_boundary="fail"
          if [[ "${#worker_invokers[@]}" -eq 1 && "${worker_invokers[0]}" == "${expected_worker_member}" ]]; then worker_iam_boundary="pass"; fi

          expected_audience="https://corvis-worker-${CORVIS_ENVIRONMENT}.internal"
          subscription="$(gcloud pubsub subscriptions describe "processing-worker-${CORVIS_ENVIRONMENT}" --project="${GCP_PROJECT_ID}" --format=json)"
          scheduler="$(gcloud scheduler jobs describe "corvis-delivery-${CORVIS_ENVIRONMENT}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          worker_transport_boundary="fail"
          if [[ "$(jq -r '.pushConfig.pushEndpoint // empty' <<<"${subscription}")" == "${worker_url}/api/internal/processing-stage" \
             && "$(jq -r '.pushConfig.oidcToken.serviceAccountEmail // empty' <<<"${subscription}")" == "${worker_service_account}" \
             && "$(jq -r '.pushConfig.oidcToken.audience // empty' <<<"${subscription}")" == "${expected_audience}" \
             && "$(jq -r '.httpTarget.uri // empty' <<<"${scheduler}")" == "${worker_url}/api/internal/delivery" \
             && "$(jq -r '.httpTarget.oidcToken.serviceAccountEmail // empty' <<<"${scheduler}")" == "${worker_service_account}" \
             && "$(jq -r '.httpTarget.oidcToken.audience // empty' <<<"${scheduler}")" == "${expected_audience}" ]]; then
            worker_transport_boundary="pass"
          fi

          cloud_run_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "${cloud_run_url}/api/v1/health" || true)"
          worker_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "${worker_url}/api/internal/delivery" || true)"

          echo "API_GATEWAY_HOSTNAME=${gateway_hostname}" >> "${GITHUB_ENV}"
          echo "DIRECT_CLOUD_RUN_BYPASS_STATUS=${cloud_run_status}" >> "${GITHUB_ENV}"
          echo "CLOUD_RUN_IAM_BOUNDARY=${iam_boundary}" >> "${GITHUB_ENV}"
          echo "EXPECTED_GATEWAY_INVOKER=${expected_member}" >> "${GITHUB_ENV}"
          echo "DIRECT_WORKER_BYPASS_STATUS=${worker_status}" >> "${GITHUB_ENV}"
          echo "WORKER_IAM_BOUNDARY=${worker_iam_boundary}" >> "${GITHUB_ENV}"
          echo "EXPECTED_WORKER_INVOKER=${expected_worker_member}" >> "${GITHUB_ENV}"
          echo "WORKER_TRANSPORT_BOUNDARY=${worker_transport_boundary}" >> "${GITHUB_ENV}"
      - name: Verify edge, gateway, worker and origin security
        run: node .github/scripts/security-acceptance.mjs
      - name: Upload sanitized edge security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-security-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: security-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record control evidence
        if: always()
        shell: bash
        env:
          CORVIS_CONTROL_TENANT_ID: ${{ vars.CORVIS_CONTROL_TENANT_ID }}
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" node scripts/collect-control-evidence.ts security-acceptance-evidence.json
          unset dsn

  postgres-rls:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      POSTGRES_DSN_SECRET_NAME: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      CORVIS_POSTGRES_CA_CERT: ${{ vars.CORVIS_POSTGRES_CA_CERT || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # scripts/collect-control-evidence.ts imports lib/server/postgres.ts -> pg.
      - name: Install control evidence runtime
        run: npm ci --ignore-scripts
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Verify live Postgres RLS tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          result="pass"
          if ! PGCONNECT_TIMEOUT=15 psql "${dsn}" -X -v ON_ERROR_STOP=1 -f db/postgres/security_acceptance.sql; then result="fail"; fi
          unset dsn
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg environment "${CORVIS_ENVIRONMENT}" --arg checkedAt "${checked_at}" --arg result "${result}" '{schemaVersion:"corvis.postgres-rls-security-acceptance.v1", environment:$environment, checkedAt:$checkedAt, source:"github-actions", result:$result, checks:["two-tenant-workspace-read-isolation","two-tenant-feature-flag-read-isolation","two-tenant-control-evidence-read-isolation","two-tenant-source-document-read-isolation","two-tenant-export-read-isolation","authenticated-control-mutation-denied"]}' > postgres-rls-security-acceptance-evidence.json
          [[ "${result}" == "pass" ]]
      - name: Upload sanitized Postgres RLS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-rls-security-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: postgres-rls-security-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record control evidence
        if: always()
        shell: bash
        env:
          CORVIS_CONTROL_TENANT_ID: ${{ vars.CORVIS_CONTROL_TENANT_ID }}
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" node scripts/collect-control-evidence.ts postgres-rls-security-acceptance-evidence.json
          unset dsn

  control-loop:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      POSTGRES_DSN_SECRET_NAME: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      CORVIS_POSTGRES_CA_CERT: ${{ vars.CORVIS_POSTGRES_CA_CERT || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # scripts/collect-control-evidence.ts imports lib/server/postgres.ts -> pg.
      - name: Install control evidence runtime
        run: npm ci --ignore-scripts
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"
      - name: Verify scheduled control-loop runtime
        shell: bash
        run: |
          set -euo pipefail
          service_account="corvis-control-loop-${CORVIS_ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          state_bucket="${GCP_PROJECT_ID}-corvis-control-loop-${CORVIS_ENVIRONMENT}"
          expected_image_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/corvis/control-loop@sha256:"
          result="pass"
          daily_image=""

          for cadence in daily weekly monthly; do
            case "${cadence}" in
              daily) expected_mode="daily"; expected_schedule="17 2 * * *" ;;
              weekly) expected_mode="weekly"; expected_schedule="23 3 * * 0" ;;
              monthly) expected_mode="monthly-candidate"; expected_schedule="31 4 * * 0" ;;
            esac
            name="corvis-control-loop-${cadence}-${CORVIS_ENVIRONMENT}"
            job="$(gcloud run jobs describe "${name}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
            scheduler="$(gcloud scheduler jobs describe "${name}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
            policy="$(gcloud run jobs get-iam-policy "${name}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"

            image="$(jq -r '.template.template.containers[0].image // empty' <<<"${job}")"
            job_sa="$(jq -r '.template.template.serviceAccount // empty' <<<"${job}")"
            mode="$(jq -r '.template.template.containers[0].args[1] // empty' <<<"${job}")"
            invoker_count="$(jq --arg member "serviceAccount:${service_account}" '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(. == $member)] | length' <<<"${policy}")"
            uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/jobs/${name}:run"

            if [[ ! "${image}" =~ ^${expected_image_prefix}[0-9a-f]{64}$ \
               || "${job_sa}" != "${service_account}" \
               || "${mode}" != "${expected_mode}" \
               || "${invoker_count}" != "1" \
               || "$(jq -r '.schedule // empty' <<<"${scheduler}")" != "${expected_schedule}" \
               || "$(jq -r '.timeZone // empty' <<<"${scheduler}")" != "Asia/Singapore" \
               || "$(jq -r '.httpTarget.uri // empty' <<<"${scheduler}")" != "${uri}" \
               || "$(jq -r '.httpTarget.oauthToken.serviceAccountEmail // empty' <<<"${scheduler}")" != "${service_account}" ]]; then
              result="fail"
            fi
            if [[ -z "${daily_image}" ]]; then daily_image="${image}"; elif [[ "${image}" != "${daily_image}" ]]; then result="fail"; fi
          done

          bucket="$(gcloud storage buckets describe "gs://${state_bucket}" --format=json)"
          bucket_policy="$(gcloud storage buckets get-iam-policy "gs://${state_bucket}" --format=json)"
          state_admin_count="$(jq --arg member "serviceAccount:${service_account}" '[.bindings[]? | select(.role == "roles/storage.objectAdmin") | .members[]? | select(. == $member)] | length' <<<"${bucket_policy}")"
          public_members="$(jq '[.bindings[]?.members[]? | select(. == "allUsers" or . == "allAuthenticatedUsers")] | length' <<<"${bucket_policy}")"
          if [[ "$(jq -r '.iamConfiguration.publicAccessPrevention // empty' <<<"${bucket}")" != "enforced" \
             || "$(jq -r '.iamConfiguration.uniformBucketLevelAccess.enabled // false' <<<"${bucket}")" != "true" \
             || "$(jq -r '.versioning.enabled // false' <<<"${bucket}")" != "true" \
             || "${state_admin_count}" != "1" \
             || "${public_members}" != "0" ]]; then
            result="fail"
          fi

          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg environment "${CORVIS_ENVIRONMENT}" --arg checkedAt "${checked_at}" --arg result "${result}" --arg image "${daily_image}" '{schemaVersion:"corvis.control-loop-runtime-acceptance.v1",environment:$environment,checkedAt:$checkedAt,source:"github-actions",result:$result,image:$image,checks:["immutable-job-image","dedicated-service-identity","job-invoker-policy","singapore-schedules","oauth-scheduler-targets","shared-release-image","private-versioned-state-bucket","bounded-state-iam"]}' > control-loop-runtime-acceptance-evidence.json
          [[ "${result}" == "pass" ]]
      - name: Upload sanitized control-loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-loop-runtime-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: control-loop-runtime-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record control evidence
        if: always()
        shell: bash
        env:
          CORVIS_CONTROL_TENANT_ID: ${{ vars.CORVIS_CONTROL_TENANT_ID }}
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" node scripts/collect-control-evidence.ts control-loop-runtime-acceptance-evidence.json
          unset dsn

  record-known-good-release:
    needs: [edge, postgres-rls, control-loop]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      TF_STATE_BUCKET: ${{ format('{0}-corvis-tf-state', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"
      - name: Record accepted release set as known-good rollback target
        shell: bash
        run: |
          set -euo pipefail
          image="$(gcloud run services describe "corvis-api-${{ inputs.environment }}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(spec.template.spec.containers.image)')"
          control_loop_job="$(gcloud run jobs describe "corvis-control-loop-daily-${{ inputs.environment }}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          control_loop_image="$(jq -r '.template.template.containers[0].image // empty' <<<"${control_loop_job}")"
          expected_api_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/corvis/api@sha256:"
          expected_control_loop_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/corvis/control-loop@sha256:"
          if [[ ! "${image}" =~ ^${expected_api_prefix}[0-9a-f]{64}$ ]]; then echo "Accepted API revision is not pinned to the expected Artifact Registry digest."; exit 1; fi
          if [[ ! "${control_loop_image}" =~ ^${expected_control_loop_prefix}[0-9a-f]{64}$ ]]; then echo "Accepted control-loop job is not pinned to the expected Artifact Registry digest."; exit 1; fi
          accepted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg schemaVersion "corvis.known-good-release.v2" --arg environment "${{ inputs.environment }}" --arg image "${image}" --arg controlLoopImage "${control_loop_image}" --arg acceptedAt "${accepted_at}" --arg acceptanceWorkflowSha "${GITHUB_SHA}" --arg acceptanceRunId "${GITHUB_RUN_ID}" '{schemaVersion:$schemaVersion,environment:$environment,image:$image,controlLoopImage:$controlLoopImage,acceptedAt:$acceptedAt,acceptanceWorkflowSha:$acceptanceWorkflowSha,acceptanceRunId:$acceptanceRunId}' > known-good.json
          destination="gs://${TF_STATE_BUCKET}/releases/${{ inputs.environment }}/known-good.json"
          gcloud storage cp known-good.json "${destination}"
          { echo "### Known-good rollback target"; echo "- Environment: `${{ inputs.environment }}`"; echo "- Accepted API/worker image: `${image}`"; echo "- Accepted control-loop image: `${control_loop_image}`"; echo "- Manifest: `${destination}`"; } >> "${GITHUB_STEP_SUMMARY}"
