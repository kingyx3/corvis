name: Security acceptance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production-like environment to verify
        required: true
        type: choice
        options: [uat, prod]
        default: uat

permissions:
  contents: read
  id-token: write

concurrency:
  group: security-acceptance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      GCP_REGION: asia-southeast1
      POSTGRES_DSN_SECRET_NAME: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: Derive API hostname
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ZONE_NAME}" ]]; then
            echo "CLOUDFLARE_ZONE_NAME is required for edge security acceptance."
            exit 1
          fi
          case "${CORVIS_ENVIRONMENT}" in
            prod) api_hostname="api.${CLOUDFLARE_ZONE_NAME}" ;;
            uat) api_hostname="api.uat.${CLOUDFLARE_ZONE_NAME}" ;;
            *) echo "Unsupported production-like environment: ${CORVIS_ENVIRONMENT}"; exit 1 ;;
          esac
          echo "API_HOSTNAME=${api_hostname}" >> "${GITHUB_ENV}"
          echo "CUSTOMER_HOSTNAME=${{ vars.CUSTOMER_HOSTNAME }}" >> "${GITHUB_ENV}"
          echo "ADMIN_HOSTNAME=${{ vars.ADMIN_HOSTNAME }}" >> "${GITHUB_ENV}"
      - name: Probe API and worker IAM boundaries
        shell: bash
        run: |
          set -euo pipefail
          gateway_hostname="$(gcloud api-gateway gateways describe "corvis-api-${CORVIS_ENVIRONMENT}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(defaultHostname)')"
          [[ -n "${gateway_hostname}" ]] || { echo "Unable to derive API Gateway hostname."; exit 1; }

          cloud_run_url="$(gcloud run services describe "corvis-api-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          worker_url="$(gcloud run services describe "corvis-worker-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')"
          [[ -n "${cloud_run_url}" && -n "${worker_url}" ]] || { echo "Unable to derive Cloud Run service URLs."; exit 1; }

          gateway_service_account="corvis-gateway-${CORVIS_ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          expected_member="serviceAccount:${gateway_service_account}"
          iam_policy="$(gcloud run services get-iam-policy "corvis-api-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          mapfile -t invokers < <(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | unique[]' <<<"${iam_policy}")
          iam_boundary="fail"
          if [[ "${#invokers[@]}" -eq 1 && "${invokers[0]}" == "${expected_member}" ]]; then iam_boundary="pass"; fi

          worker_service_account="corvis-worker-${CORVIS_ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          expected_worker_member="serviceAccount:${worker_service_account}"
          worker_policy="$(gcloud run services get-iam-policy "corvis-worker-${CORVIS_ENVIRONMENT}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          mapfile -t worker_invokers < <(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | unique[]' <<<"${worker_policy}")
          worker_iam_boundary="fail"
          if [[ "${#worker_invokers[@]}" -eq 1 && "${worker_invokers[0]}" == "${expected_worker_member}" ]]; then worker_iam_boundary="pass"; fi

          expected_audience="https://corvis-worker-${CORVIS_ENVIRONMENT}.internal"
          subscription="$(gcloud pubsub subscriptions describe "processing-worker-${CORVIS_ENVIRONMENT}" --project="${GCP_PROJECT_ID}" --format=json)"
          scheduler="$(gcloud scheduler jobs describe "corvis-delivery-${CORVIS_ENVIRONMENT}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format=json)"
          worker_transport_boundary="fail"
          if [[ "$(jq -r '.pushConfig.pushEndpoint // empty' <<<"${subscription}")" == "${worker_url}/api/internal/processing-stage" \
             && "$(jq -r '.pushConfig.oidcToken.serviceAccountEmail // empty' <<<"${subscription}")" == "${worker_service_account}" \
             && "$(jq -r '.pushConfig.oidcToken.audience // empty' <<<"${subscription}")" == "${expected_audience}" \
             && "$(jq -r '.httpTarget.uri // empty' <<<"${scheduler}")" == "${worker_url}/api/internal/delivery" \
             && "$(jq -r '.httpTarget.oidcToken.serviceAccountEmail // empty' <<<"${scheduler}")" == "${worker_service_account}" \
             && "$(jq -r '.httpTarget.oidcToken.audience // empty' <<<"${scheduler}")" == "${expected_audience}" ]]; then
            worker_transport_boundary="pass"
          fi

          cloud_run_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "${cloud_run_url}/api/v1/health" || true)"
          worker_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 -X POST "${worker_url}/api/internal/delivery" || true)"

          echo "API_GATEWAY_HOSTNAME=${gateway_hostname}" >> "${GITHUB_ENV}"
          echo "DIRECT_CLOUD_RUN_BYPASS_STATUS=${cloud_run_status}" >> "${GITHUB_ENV}"
          echo "CLOUD_RUN_IAM_BOUNDARY=${iam_boundary}" >> "${GITHUB_ENV}"
          echo "EXPECTED_GATEWAY_INVOKER=${expected_member}" >> "${GITHUB_ENV}"
          echo "DIRECT_WORKER_BYPASS_STATUS=${worker_status}" >> "${GITHUB_ENV}"
          echo "WORKER_IAM_BOUNDARY=${worker_iam_boundary}" >> "${GITHUB_ENV}"
          echo "EXPECTED_WORKER_INVOKER=${expected_worker_member}" >> "${GITHUB_ENV}"
          echo "WORKER_TRANSPORT_BOUNDARY=${worker_transport_boundary}" >> "${GITHUB_ENV}"
      - name: Verify edge, gateway, worker and origin security
        run: node .github/scripts/security-acceptance.mjs
      - name: Upload sanitized edge security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-security-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: security-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record control evidence
        if: always()
        shell: bash
        env:
          CORVIS_CONTROL_TENANT_ID: ${{ vars.CORVIS_CONTROL_TENANT_ID }}
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" node scripts/collect-control-evidence.ts security-acceptance-evidence.json
          unset dsn

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      CORVIS_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      POSTGRES_DSN_SECRET_NAME: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Verify live Postgres RLS tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          result="pass"
          if ! PGCONNECT_TIMEOUT=15 psql "${dsn}" -X -v ON_ERROR_STOP=1 -f db/postgres/security_acceptance.sql; then result="fail"; fi
          unset dsn
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg environment "${CORVIS_ENVIRONMENT}" --arg checkedAt "${checked_at}" --arg result "${result}" '{schemaVersion:"corvis.postgres-rls-security-acceptance.v1", environment:$environment, checkedAt:$checkedAt, source:"github-actions", result:$result, checks:["two-tenant-workspace-read-isolation","two-tenant-feature-flag-read-isolation","two-tenant-control-evidence-read-isolation","two-tenant-source-document-read-isolation","two-tenant-export-read-isolation","authenticated-control-mutation-denied"]}' > postgres-rls-security-acceptance-evidence.json
          [[ "${result}" == "pass" ]]
      - name: Upload sanitized Postgres RLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rls-security-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: postgres-rls-security-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record control evidence
        if: always()
        shell: bash
        env:
          CORVIS_CONTROL_TENANT_ID: ${{ vars.CORVIS_CONTROL_TENANT_ID }}
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET_NAME}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" node scripts/collect-control-evidence.ts postgres-rls-security-acceptance-evidence.json
          unset dsn

  record-known-good-release:
    needs: [edge, postgres-rls]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
      TF_STATE_BUCKET: ${{ format('{0}-corvis-tf-state', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: Record accepted digest as known-good rollback target
        shell: bash
        run: |
          set -euo pipefail
          image="$(gcloud run services describe "corvis-api-${{ inputs.environment }}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(spec.template.spec.containers.image)')"
          expected_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/corvis/api@sha256:"
          if [[ ! "${image}" =~ ^${expected_prefix}[0-9a-f]{64}$ ]]; then echo "Accepted Cloud Run revision is not pinned to the expected Artifact Registry digest."; exit 1; fi
          accepted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg schemaVersion "corvis.known-good-release.v1" --arg environment "${{ inputs.environment }}" --arg image "${image}" --arg acceptedAt "${accepted_at}" --arg acceptanceWorkflowSha "${GITHUB_SHA}" --arg acceptanceRunId "${GITHUB_RUN_ID}" '{schemaVersion:$schemaVersion,environment:$environment,image:$image,acceptedAt:$acceptedAt,acceptanceWorkflowSha:$acceptanceWorkflowSha,acceptanceRunId:$acceptanceRunId}' > known-good.json
          destination="gs://${TF_STATE_BUCKET}/releases/${{ inputs.environment }}/known-good.json"
          gcloud storage cp known-good.json "${destination}"
          { echo "### Known-good rollback target"; echo "- Environment: `${{ inputs.environment }}`"; echo "- Accepted image: `${image}`"; echo "- Manifest: `${destination}`"; } >> "${GITHUB_STEP_SUMMARY}"
