name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, uat, prod]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      release_sha:
        description: Main commit previously built by Build release image; resolves git-<sha> to immutable release digests
        required: false
        type: string
      rollback_known_good:
        description: Deploy the last Security-acceptance-approved release set for this environment
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: string
      action:
        description: Terraform action
        required: true
        type: string
      release_sha:
        description: Main commit previously built by Build release image
        required: false
        type: string
        default: ""
      rollback_known_good:
        description: Deploy the last Security-acceptance-approved release set for this environment
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_source_bucket_name: ${{ format('{0}-documents', vars.GCP_PROJECT_ID) }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_enable_cloudflare_managed_waf: ${{ vars.CLOUDFLARE_MANAGED_WAF_ENABLED || 'false' }}
      TF_VAR_auth_issuer: ${{ vars.CORVIS_AUTH_ISSUER }}
      TF_VAR_auth_audience: ${{ vars.CORVIS_AUTH_AUDIENCE || 'corvis' }}
      TF_VAR_auth_jwks_url: ${{ vars.CORVIS_AUTH_JWKS_URL || '' }}
      TF_VAR_postgres_ca_cert: ${{ vars.CORVIS_POSTGRES_CA_CERT || '' }}
      TF_VAR_decommission_mode: "false"
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID || '' }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.MONITORING_NOTIFICATION_CHANNEL_IDS || '[]' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_STATE_BUCKET: ${{ format('{0}-corvis-tf-state', vars.GCP_PROJECT_ID) }}
      TF_ROOT: infra/terraform/environments/${{ inputs.environment }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: corvis
      API_IMAGE_NAME: api
      CONTROL_LOOP_IMAGE_NAME: control-loop
      POSTGRES_DSN_SECRET: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Validate deployment roots
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev|uat|prod) ;;
            *) echo "Unsupported deployment environment: ${{ inputs.environment }}"; exit 1 ;;
          esac
          case "${{ inputs.action }}" in
            plan|apply) ;;
            *) echo "Unsupported Terraform action: ${{ inputs.action }}"; exit 1 ;;
          esac
          if [[ -z "${TF_VAR_project_id}" ]]; then
            echo "Missing required GitHub Environment variable: GCP_PROJECT_ID"
            exit 1
          fi
          if [[ -z "${GCP_WIF_PROVIDER}" ]]; then
            echo "Missing required GitHub Environment variable: GCP_WIF_PROVIDER"
            exit 1
          fi
          if [[ -n "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
            echo "Choose either release_sha or rollback_known_good, not both."
            exit 1
          fi
          if [[ -n "${RELEASE_SHA}" && ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character lowercase Git commit SHA."
            exit 1
          fi
          if [[ "${{ inputs.action }}" == "apply" && "${{ inputs.environment }}" != "dev" && -z "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" != "true" ]]; then
            echo "Normal UAT/prod apply requires release_sha or rollback_known_good. Use the guarded decommission workflow to idle a runtime."
            exit 1
          fi
          if [[ ( -n "${RELEASE_SHA}" || "${ROLLBACK_KNOWN_GOOD}" == "true" ) && -z "${TF_VAR_auth_issuer}" ]]; then
            echo "CORVIS_AUTH_ISSUER is required before a production-like runtime can be promoted."
            exit 1
          fi
          if [[ -n "${TF_VAR_auth_jwks_url}" && ! "${TF_VAR_auth_jwks_url}" =~ ^https:// ]]; then
            echo "CORVIS_AUTH_JWKS_URL must use HTTPS when explicitly configured."
            exit 1
          fi

      - name: Guard apply source
        if: inputs.action == 'apply' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Terraform apply is allowed only from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify effective release governance
        if: inputs.action == 'apply'
        env:
          # Ruleset bypass_actors are only returned to callers with ruleset
          # write access, which the workflow GITHUB_TOKEN can never hold.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node .github/scripts/release-governance.mjs

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"

      - name: Require bootstrap-owned remote state
        run: bash .github/scripts/terraform-state.sh require

      - name: Resolve immutable release set
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
        run: |
          set -euo pipefail
          api_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${API_IMAGE_NAME}"
          control_loop_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${CONTROL_LOOP_IMAGE_NAME}"
          api_image=""
          control_loop_image=""

          if [[ "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
            manifest="gs://${TF_STATE_BUCKET}/releases/${{ inputs.environment }}/known-good.json"
            if ! gcloud storage cat "${manifest}" > known-good.json; then
              echo "No Security-acceptance-approved rollback manifest exists for ${{ inputs.environment }}."
              exit 1
            fi
            api_image="$(jq -r '.image // empty' known-good.json)"
            control_loop_image="$(jq -r '.controlLoopImage // empty' known-good.json)"
            rm -f known-good.json
            if [[ ! "${api_image}" =~ ^${api_repo}@sha256:[0-9a-f]{64}$ ]]; then
              echo "Known-good manifest did not contain the expected immutable API image."
              exit 1
            fi
            if [[ "${{ inputs.environment }}" != "dev" && ! "${control_loop_image}" =~ ^${control_loop_repo}@sha256:[0-9a-f]{64}$ ]]; then
              echo "Known-good manifest predates the scheduled control-loop runtime or contains the wrong image. Promote a fresh accepted release before using rollback."
              exit 1
            fi
          elif [[ -n "${RELEASE_SHA}" ]]; then
            api_tagged_ref="${api_repo}:git-${RELEASE_SHA}"
            api_digest="$(gcloud artifacts docker images describe "${api_tagged_ref}" --project="${TF_VAR_project_id}" --format='value(image_summary.digest)')"
            [[ "${api_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "API release tag did not resolve to an immutable digest."; exit 1; }
            api_image="${api_repo}@${api_digest}"

            if [[ "${{ inputs.environment }}" != "dev" ]]; then
              control_loop_tagged_ref="${control_loop_repo}:git-${RELEASE_SHA}"
              control_loop_digest="$(gcloud artifacts docker images describe "${control_loop_tagged_ref}" --project="${TF_VAR_project_id}" --format='value(image_summary.digest)')"
              [[ "${control_loop_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Control-loop release tag did not resolve to an immutable digest."; exit 1; }
              control_loop_image="${control_loop_repo}@${control_loop_digest}"
            fi
          fi

          if [[ -n "${api_image}" ]]; then
            gcloud artifacts docker images describe "${api_image}" --project="${TF_VAR_project_id}" >/dev/null
          fi
          if [[ -n "${control_loop_image}" ]]; then
            gcloud artifacts docker images describe "${control_loop_image}" --project="${TF_VAR_project_id}" >/dev/null
          fi

          echo "TF_VAR_api_image=${api_image}" >> "${GITHUB_ENV}"
          echo "TF_VAR_control_loop_image=${control_loop_image}" >> "${GITHUB_ENV}"

          {
            echo "### Terraform release selection"
            if [[ -n "${api_image}" ]]; then
              echo "- API/worker image: `${api_image}`"
            else
              echo "- API/worker runtime: disabled (no release selected)"
            fi
            if [[ "${{ inputs.environment }}" != "dev" ]]; then
              echo "- Control-loop image: `${control_loop_image}`"
            fi
            echo "- Rollback source: `${ROLLBACK_KNOWN_GOOD}`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate runtime activation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TF_VAR_api_image}" && ! "${TF_VAR_api_image}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved API image must be an immutable digest reference."
            exit 1
          fi
          if [[ "${{ inputs.environment }}" != "dev" && -n "${TF_VAR_api_image}" && ! "${TF_VAR_control_loop_image}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Production-like promotion requires an immutable control-loop image from the same release commit."
            exit 1
          fi

          if [[ -n "${TF_VAR_cloudflare_zone_name}" ]]; then
            if [[ "${{ inputs.environment }}" == "dev" ]]; then
              echo "Cloudflare public-edge deployment is intentionally limited to uat/prod."
              exit 1
            fi
            if [[ -z "${TF_VAR_api_image}" ]]; then
              echo "Cloudflare API edge activation requires release_sha or rollback_known_good."
              exit 1
            fi
            if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
              echo "Cloudflare edge configuration requires the CLOUDFLARE_API_TOKEN GitHub Environment secret."
              exit 1
            fi
          fi

      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir="${TF_ROOT}" init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=corvis/${{ inputs.environment }}"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: terraform -chdir="${TF_ROOT}" validate

      - name: Terraform plan
        run: terraform -chdir="${TF_ROOT}" plan -lock-timeout=5m -out=tfplan

      # The dev root is foundation-only (no Cloud Run runtime, no Postgres DSN
      # secret), so runtime secret checks and migrations apply to uat/prod only.
      - name: Require enabled Postgres runtime secret
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        shell: bash
        run: |
          set -euo pipefail
          version="$(gcloud secrets versions list "${POSTGRES_DSN_SECRET}" \
            --project="${GCP_PROJECT_ID}" \
            --filter='state=ENABLED' \
            --sort-by='~createTime' \
            --limit=1 \
            --format='value(name)')"
          if [[ -z "${version}" ]]; then
            echo "${POSTGRES_DSN_SECRET} has no enabled version. Activate the environment Postgres provider before runtime promotion."
            exit 1
          fi
          echo "Postgres runtime secret has an enabled version (${version##*/}); value was not logged."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        with:
          node-version: 24
          cache: npm

      - name: Install migration runtime
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Apply versioned Postgres migrations
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        shell: bash
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET}")"
          echo "::add-mask::${dsn}"
          CORVIS_POSTGRES_DSN="${dsn}" CORVIS_POSTGRES_CA_CERT="${TF_VAR_postgres_ca_cert}" node db/postgres/migrate.ts \
            --apply \
            --applied-by="github-actions:${GITHUB_RUN_ID}" \
            --evidence=migration-evidence.json
          unset dsn

      - name: Upload migration evidence
        if: always() && inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-migration-${{ inputs.environment }}-${{ github.run_id }}
          path: migration-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform -chdir="${TF_ROOT}" apply -lock-timeout=5m -auto-approve tfplan

      - name: Verify public health after apply
        if: inputs.action == 'apply' && env.TF_VAR_cloudflare_zone_name != '' && env.TF_VAR_api_image != ''
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            prod) api_hostname="api.${TF_VAR_cloudflare_zone_name}" ;;
            uat) api_hostname="api-uat.${TF_VAR_cloudflare_zone_name}" ;;
            *) exit 0 ;;
          esac
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 \
            "https://${api_hostname}/api/v1/health" >/dev/null
          echo "Public health passed through Cloudflare -> API Gateway -> Cloud Run."
