name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: choice
        options: [dev, uat, prod]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      release_sha:
        description: Main commit previously built by Build release image; resolves git-<sha> to immutable release digests
        required: false
        type: string
      rollback_known_good:
        description: Deploy the last Security-acceptance-approved release set for this environment
        required: false
        type: boolean
        default: false
      approved_plan_sha256:
        description: SHA-256 of the reviewed Terraform text plan; required for apply
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        type: string
      action:
        description: Terraform action
        required: true
        type: string
      release_sha:
        description: Main commit previously built by Build release image
        required: false
        type: string
        default: ""
      rollback_known_good:
        description: Deploy the last Security-acceptance-approved release set for this environment
        required: false
        type: boolean
        default: false
      approved_plan_sha256:
        description: SHA-256 of the reviewed Terraform text plan; required for apply
        required: false
        type: string
        default: ""
    outputs:
      api_image:
        description: Immutable API/worker image reference resolved for this deployment
        value: ${{ jobs.terraform.outputs.api_image }}
      control_loop_image:
        description: Immutable control-loop image reference resolved for this deployment
        value: ${{ jobs.terraform.outputs.control_loop_image }}
      extractor_image:
        description: Immutable governed extraction-harness image reference resolved for this deployment
        value: ${{ jobs.terraform.outputs.extractor_image }}
      litellm_image:
        description: Immutable LiteLLM gateway image reference resolved for this deployment
        value: ${{ jobs.terraform.outputs.litellm_image }}
      plan_sha256:
        description: SHA-256 of the rendered Terraform plan reviewed for this release
        value: ${{ jobs.terraform.outputs.plan_sha256 }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      api_image: ${{ steps.release.outputs.api_image }}
      control_loop_image: ${{ steps.release.outputs.control_loop_image }}
      extractor_image: ${{ steps.release.outputs.extractor_image }}
      litellm_image: ${{ steps.release.outputs.litellm_image }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_source_bucket_name: ${{ format('{0}-documents', vars.GCP_PROJECT_ID) }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_enable_cloudflare_managed_waf: ${{ vars.CLOUDFLARE_MANAGED_WAF_ENABLED || 'false' }}
      TF_VAR_auth_issuer: ${{ vars.CORVIS_AUTH_ISSUER }}
      TF_VAR_auth_audience: ${{ vars.CORVIS_AUTH_AUDIENCE || 'corvis' }}
      TF_VAR_auth_jwks_url: ${{ vars.CORVIS_AUTH_JWKS_URL || '' }}
      TF_VAR_extraction_endpoint: ${{ vars.CORVIS_EXTRACTION_ENDPOINT || '' }}
      TF_VAR_extraction_audience: ${{ vars.CORVIS_EXTRACTION_AUDIENCE || '' }}
      TF_VAR_extraction_timeout_ms: ${{ vars.CORVIS_EXTRACTION_TIMEOUT_MS || '300000' }}
      TF_VAR_litellm_models_json: ${{ vars.CORVIS_LITELLM_MODELS_JSON || '' }}
      TF_VAR_postgres_ca_cert: ${{ vars.CORVIS_POSTGRES_CA_CERT || '' }}
      TF_VAR_decommission_mode: "false"
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID || '' }}
      TF_VAR_monthly_budget_amount_usd: ${{ vars.GCP_MONTHLY_BUDGET_USD || (inputs.environment == 'uat' && '5' || inputs.environment == 'prod' && '2000' || '500') }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.MONITORING_NOTIFICATION_CHANNEL_IDS || '[]' }}
      TF_VAR_control_loop_github_token_configured: ${{ vars.CONTROL_LOOP_GITHUB_TOKEN_CONFIGURED || 'false' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_STATE_BUCKET: ${{ format('{0}-corvis-tf-state', vars.GCP_PROJECT_ID) }}
      TF_ROOT: infra/terraform/environments/${{ inputs.environment }}
      GCP_REGION: asia-southeast1
      ARTIFACT_REPOSITORY: corvis
      API_IMAGE_NAME: api
      CONTROL_LOOP_IMAGE_NAME: control-loop
      EXTRACTOR_IMAGE_NAME: extractor
      LITELLM_IMAGE_NAME: litellm
      POSTGRES_DSN_SECRET: ${{ format('corvis-postgres-dsn-{0}', inputs.environment) }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ format('corvis-deploy@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
    steps:
      - name: Validate deployment roots
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
          APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev|uat|prod) ;;
            *) echo "Unsupported deployment environment: ${{ inputs.environment }}"; exit 1 ;;
          esac
          case "${{ inputs.action }}" in
            plan|apply) ;;
            *) echo "Unsupported Terraform action: ${{ inputs.action }}"; exit 1 ;;
          esac
          [[ -n "${TF_VAR_project_id}" ]] || { echo "Missing required GitHub Environment variable: GCP_PROJECT_ID"; exit 1; }
          [[ -n "${GCP_WIF_PROVIDER}" ]] || { echo "Missing required GitHub Environment variable: GCP_WIF_PROVIDER"; exit 1; }
          if [[ ! "${TF_VAR_monthly_budget_amount_usd}" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk "BEGIN { exit !(${TF_VAR_monthly_budget_amount_usd} > 0) }"; then
            echo "GCP_MONTHLY_BUDGET_USD must be a positive numeric amount."
            exit 1
          fi
          if [[ ! "${TF_VAR_extraction_timeout_ms}" =~ ^[0-9]+$ ]] || (( TF_VAR_extraction_timeout_ms < 1000 || TF_VAR_extraction_timeout_ms > 480000 )); then
            echo "CORVIS_EXTRACTION_TIMEOUT_MS must be an integer between 1000 and 480000."
            exit 1
          fi
          if [[ -n "${TF_VAR_litellm_models_json}" ]]; then
            jq -e 'type == "object" and length > 0 and (."corvis-extract-primary" | type == "string" and length > 0)' <<<"${TF_VAR_litellm_models_json}" >/dev/null || {
              echo "CORVIS_LITELLM_MODELS_JSON must be a non-empty JSON object with string corvis-extract-primary."; exit 1;
            }
          fi
          if [[ -n "${TF_VAR_extraction_endpoint}" && ! "${TF_VAR_extraction_endpoint}" =~ ^https:// ]]; then
            echo "CORVIS_EXTRACTION_ENDPOINT must use HTTPS when configured."
            exit 1
          fi
          if [[ -n "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
            echo "Choose either release_sha or rollback_known_good, not both."
            exit 1
          fi
          if [[ -n "${RELEASE_SHA}" && ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character lowercase Git commit SHA."
            exit 1
          fi
          if [[ "${{ inputs.action }}" == "apply" && ! "${APPROVED_PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Terraform apply requires approved_plan_sha256 from a successful reviewed plan of the same release."
            exit 1
          fi
          if [[ "${{ inputs.action }}" == "apply" && "${{ inputs.environment }}" != "dev" && -z "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" != "true" ]]; then
            echo "Normal UAT/prod apply requires release_sha or rollback_known_good. Use the guarded decommission workflow to idle a runtime."
            exit 1
          fi
          if [[ ( -n "${RELEASE_SHA}" || "${ROLLBACK_KNOWN_GOOD}" == "true" ) && -z "${TF_VAR_auth_issuer}" ]]; then
            echo "CORVIS_AUTH_ISSUER is required before a production-like runtime can be promoted."
            exit 1
          fi
          if [[ -n "${TF_VAR_auth_jwks_url}" && ! "${TF_VAR_auth_jwks_url}" =~ ^https:// ]]; then
            echo "CORVIS_AUTH_JWKS_URL must use HTTPS when explicitly configured."
            exit 1
          fi

      - name: Guard apply source
        if: inputs.action == 'apply' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Terraform apply is allowed only from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha != '' && inputs.release_sha || github.sha }}

      - name: Assert release matches deployment checkout
        if: inputs.release_sha != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash tools/ci/assert-release-matches-head.sh "${RELEASE_SHA}"

      - name: Verify effective release governance
        if: inputs.action == 'apply'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node tools/ci/release-governance.mjs

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 416.0.0"

      - uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: "1.13.3"

      - name: Require bootstrap-owned remote state
        run: bash tools/ci/terraform-state.sh require

      - name: Resolve immutable release set
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
        run: |
          set -euo pipefail
          api_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${API_IMAGE_NAME}"
          control_loop_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${CONTROL_LOOP_IMAGE_NAME}"
          extractor_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${EXTRACTOR_IMAGE_NAME}"
          litellm_repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${LITELLM_IMAGE_NAME}"
          api_image=""; control_loop_image=""; extractor_image=""; litellm_image=""
          legacy_ai_rollback="false"

          resolve_tag() {
            local repo="$1" label="$2"
            local digest
            digest="$(gcloud artifacts docker images describe "${repo}:git-${RELEASE_SHA}" --project="${TF_VAR_project_id}" --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "${label} release tag did not resolve to an immutable digest."; exit 1; }
            printf '%s@%s' "${repo}" "${digest}"
          }

          if [[ "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
            manifest="gs://${TF_STATE_BUCKET}/releases/${{ inputs.environment }}/known-good.json"
            gcloud storage cat "${manifest}" > known-good.json || { echo "No Security-acceptance-approved rollback manifest exists for ${{ inputs.environment }}."; exit 1; }
            api_image="$(jq -r '.image // empty' known-good.json)"
            control_loop_image="$(jq -r '.controlLoopImage // empty' known-good.json)"
            extractor_image="$(jq -r '.extractorImage // empty' known-good.json)"
            litellm_image="$(jq -r '.litellmImage // empty' known-good.json)"
            rm -f known-good.json
            [[ "${api_image}" =~ ^${api_repo}@sha256:[0-9a-f]{64}$ ]] || { echo "Known-good manifest did not contain the expected API image."; exit 1; }
            if [[ "${{ inputs.environment }}" != "dev" ]]; then
              [[ "${control_loop_image}" =~ ^${control_loop_repo}@sha256:[0-9a-f]{64}$ ]] || { echo "Known-good manifest is missing the production-like control-loop image."; exit 1; }
            fi
            if [[ -n "${extractor_image}" || -n "${litellm_image}" ]]; then
              [[ "${extractor_image}" =~ ^${extractor_repo}@sha256:[0-9a-f]{64}$ ]] || { echo "Known-good manifest contains an invalid extractor image."; exit 1; }
              [[ "${litellm_image}" =~ ^${litellm_repo}@sha256:[0-9a-f]{64}$ ]] || { echo "Known-good manifest contains an invalid LiteLLM image."; exit 1; }
            elif [[ -n "${TF_VAR_litellm_models_json}" ]]; then
              legacy_ai_rollback="true"
              echo "TF_VAR_litellm_models_json=" >> "${GITHUB_ENV}"
              echo "TF_VAR_extraction_endpoint=" >> "${GITHUB_ENV}"
              echo "TF_VAR_extraction_audience=" >> "${GITHUB_ENV}"
            fi
          elif [[ -n "${RELEASE_SHA}" ]]; then
            api_image="$(resolve_tag "${api_repo}" API)"
            if [[ "${{ inputs.environment }}" != "dev" ]]; then
              control_loop_image="$(resolve_tag "${control_loop_repo}" Control-loop)"
            fi
            if [[ -n "${TF_VAR_litellm_models_json}" ]]; then
              extractor_image="$(resolve_tag "${extractor_repo}" Extractor)"
              litellm_image="$(resolve_tag "${litellm_repo}" LiteLLM)"
            fi
          fi

          for image in "${api_image}" "${control_loop_image}" "${extractor_image}" "${litellm_image}"; do
            [[ -z "${image}" ]] || gcloud artifacts docker images describe "${image}" --project="${TF_VAR_project_id}" >/dev/null
          done

          echo "TF_VAR_api_image=${api_image}" >> "${GITHUB_ENV}"
          echo "TF_VAR_control_loop_image=${control_loop_image}" >> "${GITHUB_ENV}"
          echo "TF_VAR_extractor_image=${extractor_image}" >> "${GITHUB_ENV}"
          echo "TF_VAR_litellm_image=${litellm_image}" >> "${GITHUB_ENV}"
          echo "api_image=${api_image}" >> "${GITHUB_OUTPUT}"
          echo "control_loop_image=${control_loop_image}" >> "${GITHUB_OUTPUT}"
          echo "extractor_image=${extractor_image}" >> "${GITHUB_OUTPUT}"
          echo "litellm_image=${litellm_image}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Terraform release selection"
            [[ -z "${api_image}" ]] && echo "- API/worker runtime: disabled" || echo "- API/worker image: \`${api_image}\`"
            [[ -z "${control_loop_image}" ]] || echo "- Control-loop image: \`${control_loop_image}\`"
            if [[ -n "${extractor_image}" ]]; then
              echo "- Extractor image: \`${extractor_image}\`"
              echo "- LiteLLM image: \`${litellm_image}\`"
            elif [[ "${legacy_ai_rollback}" == "true" ]]; then
              echo "- AI runtime: disabled fail-closed because the accepted rollback release predates managed AI"
            else
              echo "- AI runtime: disabled until CORVIS_LITELLM_MODELS_JSON is configured"
            fi
            echo "- Rollback source: \`${ROLLBACK_KNOWN_GOOD}\`"
            echo "- Monthly budget: \`$${TF_VAR_monthly_budget_amount_usd}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate runtime activation
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${TF_VAR_api_image}" || "${TF_VAR_api_image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Resolved API image must be immutable."; exit 1; }
          if [[ "${{ inputs.environment }}" != "dev" && -n "${TF_VAR_api_image}" && ! "${TF_VAR_control_loop_image}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Production-like promotion requires an immutable control-loop image from the same release commit."; exit 1
          fi
          if [[ -n "${TF_VAR_extractor_image}" || -n "${TF_VAR_litellm_image}" ]]; then
            [[ "${TF_VAR_extractor_image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "AI activation requires immutable extractor image."; exit 1; }
            [[ "${TF_VAR_litellm_image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "AI activation requires immutable LiteLLM image."; exit 1; }
            [[ -n "${TF_VAR_litellm_models_json}" ]] || { echo "AI activation requires CORVIS_LITELLM_MODELS_JSON."; exit 1; }
          fi

          if [[ -n "${TF_VAR_cloudflare_zone_name}" ]]; then
            [[ "${{ inputs.environment }}" != "dev" ]] || { echo "Cloudflare public-edge deployment is intentionally limited to uat/prod."; exit 1; }
            [[ -n "${TF_VAR_api_image}" ]] || { echo "Cloudflare API edge activation requires release_sha or rollback_known_good."; exit 1; }
            [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "Cloudflare edge configuration requires the CLOUDFLARE_API_TOKEN GitHub Environment secret."; exit 1; }
          fi

      - name: Require enabled AI integration secrets
        if: inputs.action == 'apply' && env.TF_VAR_extractor_image != ''
        shell: bash
        run: |
          set -euo pipefail
          for secret in "corvis-ai-provider-credentials-${{ inputs.environment }}" "corvis-litellm-master-key-${{ inputs.environment }}" "corvis-atlassian-skill-read-${{ inputs.environment }}"; do
            version="$(gcloud secrets versions list "${secret}" --project="${GCP_PROJECT_ID}" --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)')"
            [[ -n "${version}" ]] || { echo "${secret} has no enabled version. Run AI integration secret provisioning first."; exit 1; }
          done
          echo "Required AI integration secrets each have an enabled version; values were not logged."

      - name: Require prod alerting channels
        if: inputs.action == 'apply' && inputs.environment == 'prod' && env.TF_VAR_api_image != '' && inputs.rollback_known_good != true
        shell: bash
        env:
          CORVIS_ENVIRONMENT: ${{ inputs.environment }}
        run: bash tools/ci/assert-prod-alerting.sh

      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir="${TF_ROOT}" init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=corvis/${{ inputs.environment }}"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: terraform -chdir="${TF_ROOT}" validate

      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" plan -lock-timeout=5m -out=tfplan
          terraform -chdir="${TF_ROOT}" show -no-color tfplan > "${RUNNER_TEMP}/tfplan.txt"
          plan_sha256="$(sha256sum "${RUNNER_TEMP}/tfplan.txt" | awk '{print $1}')"
          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${plan_sha256}" > "${RUNNER_TEMP}/tfplan.sha256"
          {
            echo "### Terraform plan (${{ inputs.environment }}, ${{ inputs.action }})"
            echo "- Deployment checkout: \`$(git rev-parse HEAD)\`"
            echo "- Reviewed plan SHA-256: \`${plan_sha256}\`"
            echo '```text'
            head -c 60000 "${RUNNER_TEMP}/tfplan.txt"
            echo
            echo '```'
            if [[ "$(wc -c < "${RUNNER_TEMP}/tfplan.txt")" -gt 60000 ]]; then echo "_Plan output truncated to 60000 bytes; download the plan artifact for the full render._"; fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reviewed Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.release_sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ runner.temp }}/tfplan.txt
            ${{ runner.temp }}/tfplan.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.environment == 'prod' && 90 || 30 }}

      - name: Verify reviewed plan digest before apply
        if: inputs.action == 'apply'
        shell: bash
        env:
          APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          ACTUAL_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "${ACTUAL_PLAN_SHA256}" == "${APPROVED_PLAN_SHA256}" ]] || {
            echo "Terraform plan changed after review; refusing apply."
            echo "Approved: ${APPROVED_PLAN_SHA256}"
            echo "Current:  ${ACTUAL_PLAN_SHA256}"
            exit 1
          }
          echo "Reviewed plan digest matches the exact plan that will be applied."

      - name: Require enabled Postgres runtime secret
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != ''
        shell: bash
        run: |
          set -euo pipefail
          version="$(gcloud secrets versions list "${POSTGRES_DSN_SECRET}" --project="${GCP_PROJECT_ID}" --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)')"
          [[ -n "${version}" ]] || { echo "${POSTGRES_DSN_SECRET} has no enabled version. Activate the environment Postgres provider before runtime promotion."; exit 1; }
          echo "Postgres runtime secret has an enabled version (${version##*/}); value was not logged."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != '' && inputs.rollback_known_good != true
        with:
          node-version: 24
          cache: npm

      - name: Install migration runtime
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != '' && inputs.rollback_known_good != true
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Apply versioned Postgres migrations
        if: inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != '' && inputs.rollback_known_good != true
        shell: bash
        run: |
          set -euo pipefail
          dsn="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="${POSTGRES_DSN_SECRET}")"
          echo "::add-mask::${dsn}"
          CORVIS_DATABASE_DSN="${dsn}" CORVIS_POSTGRES_CA_CERT="${TF_VAR_postgres_ca_cert}" node db/postgres/migrate.ts --apply --applied-by="github-actions:${GITHUB_RUN_ID}" --evidence=migration-evidence.json
          unset dsn

      - name: Upload migration evidence
        if: always() && inputs.action == 'apply' && inputs.environment != 'dev' && env.TF_VAR_api_image != '' && inputs.rollback_known_good != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-migration-${{ inputs.environment }}-${{ github.run_id }}
          path: migration-evidence.json
          if-no-files-found: error
          retention-days: ${{ inputs.environment == 'prod' && 90 || 30 }}

      - name: Terraform apply exact reviewed plan
        if: inputs.action == 'apply'
        run: terraform -chdir="${TF_ROOT}" apply -lock-timeout=5m -auto-approve tfplan

      - name: Protect active release images from registry cleanup
        if: inputs.action == 'apply' && env.TF_VAR_api_image != '' && inputs.environment != 'prod'
        shell: bash
        run: |
          set -euo pipefail
          protect() {
            local image="$1" repo_name="$2"
            [[ -z "${image}" ]] && return 0
            repo="${GCP_REGION}-docker.pkg.dev/${TF_VAR_project_id}/${ARTIFACT_REPOSITORY}/${repo_name}"
            gcloud artifacts docker tags add "${image}" "${repo}:active-${{ inputs.environment }}" --project="${TF_VAR_project_id}" --quiet
          }
          protect "${TF_VAR_api_image}" "${API_IMAGE_NAME}"
          protect "${TF_VAR_control_loop_image}" "${CONTROL_LOOP_IMAGE_NAME}"
          protect "${TF_VAR_extractor_image}" "${EXTRACTOR_IMAGE_NAME}"
          protect "${TF_VAR_litellm_image}" "${LITELLM_IMAGE_NAME}"

      - name: Verify public health after apply
        if: inputs.action == 'apply' && env.TF_VAR_cloudflare_zone_name != '' && env.TF_VAR_api_image != ''
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            prod) api_hostname="api.${TF_VAR_cloudflare_zone_name}" ;;
            uat) api_hostname="api-uat.${TF_VAR_cloudflare_zone_name}" ;;
            *) exit 0 ;;
          esac
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 "https://${api_hostname}/api/v1/health" >/dev/null
          echo "Public health passed through Cloudflare -> API Gateway -> Cloud Run."
