name: Promote environment

run-name: Promote ${{ inputs.environment }} ${{ inputs.rollback_known_good && '(known-good rollback)' || inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production-like target environment
        required: true
        type: choice
        options: [uat, prod]
        default: uat
      release_sha:
        description: Full reviewed main commit built once in the UAT release registry
        required: false
        type: string
      rollback_known_good:
        description: Redeploy the last acceptance-approved digest instead of a new release
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate promotion request
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production-like promotion may only run from main."
            exit 1
          fi
          case "${{ inputs.environment }}" in
            uat|prod) ;;
            *) echo "Promotion supports only uat or prod."; exit 1 ;;
          esac
          if [[ -n "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
            echo "Choose either release_sha or rollback_known_good, not both."
            exit 1
          fi
          if [[ -z "${RELEASE_SHA}" && "${ROLLBACK_KNOWN_GOOD}" != "true" ]]; then
            echo "Promotion requires release_sha or rollback_known_good=true."
            exit 1
          fi
          if [[ -n "${RELEASE_SHA}" && ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character lowercase Git commit SHA."
            exit 1
          fi

  copy-release-to-prod:
    if: inputs.environment == 'prod' && inputs.rollback_known_good != true
    needs: validate
    uses: ./.github/workflows/copy-release-to-prod.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  deploy:
    needs: [validate, copy-release-to-prod]
    if: ${{ always() && needs.validate.result == 'success' && (needs.copy-release-to-prod.result == 'success' || needs.copy-release-to-prod.result == 'skipped') }}
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      action: apply
      release_sha: ${{ inputs.release_sha }}
      rollback_known_good: ${{ inputs.rollback_known_good }}
    secrets: inherit

  acceptance:
    needs: deploy
    uses: ./.github/workflows/security-acceptance.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  # A prod release that fails acceptance must not stay live (#235): redeploy the
  # last acceptance-approved release set. Migrations are forward-only and the
  # rollback path skips them, so this restores the known-good images and
  # Terraform-managed runtime against the current schema. Never chains: a failed
  # known-good rollback is itself reported, not retried.
  rollback-on-failed-acceptance:
    needs: [deploy, acceptance]
    if: ${{ always() && inputs.environment == 'prod' && inputs.rollback_known_good != true && needs.deploy.result == 'success' && needs.acceptance.result == 'failure' }}
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: prod
      action: apply
      release_sha: ""
      rollback_known_good: true
    secrets: inherit

  report-rollback:
    needs: [acceptance, rollback-on-failed-acceptance]
    if: ${{ always() && needs.rollback-on-failed-acceptance.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail the promotion and record the automatic rollback
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_RESULT: ${{ needs.rollback-on-failed-acceptance.result }}
        run: |
          set -euo pipefail
          {
            echo "### Prod promotion failed acceptance"
            echo "- Rejected release: \`${RELEASE_SHA}\`"
            echo "- Automatic known-good rollback: \`${ROLLBACK_RESULT}\`"
            if [[ "${ROLLBACK_RESULT}" != "success" ]]; then
              echo "- **The rollback did not succeed: prod may be running the rejected release. Follow ops/RUNBOOK.md now.**"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          # The promotion itself failed either way; the run must stay red.
          exit 1

  complete:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record promotion completion
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_KNOWN_GOOD: ${{ inputs.rollback_known_good }}
        run: |
          set -euo pipefail
          {
            echo "### Governed promotion complete"
            echo "- Environment: \`${{ inputs.environment }}\`"
            if [[ "${ROLLBACK_KNOWN_GOOD}" == "true" ]]; then
              echo "- Release selection: last acceptance-approved known-good release set"
            else
              echo "- Release source commit: \`${RELEASE_SHA}\`"
              if [[ "${{ inputs.environment }}" == "prod" ]]; then
                echo "- Build-once: exact UAT OCI images copied to prod and digest-verified before deploy"
              fi
            fi
            echo "- Deployment: migrations + exact Terraform apply succeeded"
            echo "- Acceptance: edge/IAM/worker/control-loop transport + live Postgres RLS succeeded"
            echo "- Known-good: advanced only by the successful acceptance workflow"
          } >> "${GITHUB_STEP_SUMMARY}"
