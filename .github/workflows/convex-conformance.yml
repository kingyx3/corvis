name: Convex Conformance

# Runs on every pull request (no path filter) so the check always reports and can
# be made required without leaving unrelated PRs pending. It takes about a minute.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

concurrency:
  group: convex-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pins live in one place each: the Convex CLI version in
  # tools/convex-conformance/package.json (tracked by Dependabot) and the backend
  # image in tools/convex-conformance/run.sh. Nothing is overridden here, so a bump
  # to either is exactly what this job exercises.
  pinned:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: convex_self_hosted
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convex_self_hosted"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONVEX_POSTGRES_URL: postgresql://postgres@host.docker.internal:5432
      CONVEX_POSTGRES_VERIFY_DSN: postgresql://postgres@localhost:5432/convex_self_hosted
      CONVEX_POSTGRES_REQUIRE_TLS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Run Corvis database semantics against pinned upstream Convex + PostgreSQL
        run: bash tools/convex-conformance/run.sh

  upstream-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: convex_self_hosted
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convex_self_hosted"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONVEX_BACKEND_IMAGE: ghcr.io/get-convex/convex-backend:latest
      CONVEX_CLI_VERSION: latest
      CONVEX_POSTGRES_URL: postgresql://postgres@host.docker.internal:5432
      CONVEX_POSTGRES_VERIFY_DSN: postgresql://postgres@localhost:5432/convex_self_hosted
      CONVEX_POSTGRES_REQUIRE_TLS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Run Corvis database semantics against current upstream Convex + PostgreSQL
        run: bash tools/convex-conformance/run.sh
      # A weekly failure nobody sees is worth nothing: open (or update) one issue.
      - name: Report canary failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create convex-canary --color B60205 --description "Upstream Convex conformance canary failed" 2>/dev/null || true
          existing="$(gh issue list --label convex-canary --state open --json number --jq '.[0].number // empty')"
          body="The weekly upstream Convex canary (\`convex-backend:latest\` + \`convex@latest\`) failed: ${RUN_URL}. Do not advance the pinned backend/CLI until it is understood; see docs/engineering/CONVEX_CONFORMANCE.md."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label convex-canary --title "Convex upstream conformance canary failing" --body "$body"
          fi
