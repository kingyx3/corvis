name: Bug report
description: Something behaves differently from what the documentation or tests say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste customer data, credentials, tokens or confidential documents. For a security vulnerability use private reporting instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the environment (demo, dev, uat, prod), the route or screen, and the correlation id from the error if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: e.g. 2e7c36c
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
